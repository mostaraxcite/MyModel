name: Train XSS v0.9 Generalization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-v09-generalization.yml"

permissions:
  contents: read

concurrency:
  group: xss-v09-generalization
  cancel-in-progress: false

jobs:
  train-v09:
    if: ${{ false }} # Retired: whole-snippet classifier training; see docs/XSS_TAINT_V1.md
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
      DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"
      SANITIZE_HTML_SHA: "6ac6b8ea4898c2ba7f843d8cdd5f7d036d760a0e"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group lora --group dev

      - name: Preflight tests
        run: >
          uv run pytest -q
          tests/test_router.py
          tests/test_xss_v05.py
          tests/test_v05_fixes.py
          tests/test_pipeline.py

      - name: Build contrastive generalization corpus
        run: |
          uv run python security-models/xss/scripts/build_v08_generalization_dataset.py             --seed 2029             --groups 1200             --legacy-per-label 2200             | tee security-models/xss/evaluation/v09_contrast_build.log

      - name: Verify contrast corpus isolation
        run: |
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path

          data = Path("security-models/xss/data")
          manifest = json.loads((data / "manifest_v08.json").read_text())
          assert manifest["policy"]["external_test_v5_training_allowed"] is False
          assert manifest["policy"]["hard_test_v4_training_allowed"] is False
          assert manifest["policy"]["standard_test_training_allowed"] is False
          assert manifest["policy"]["exact_hash_overlap_with_locked_sets"] == 0
          assert manifest["policy"]["group_disjoint_generated_train_validation"] is True

          def rows(name):
              return [json.loads(x) for x in (data / name).read_text().splitlines() if x]

          train = rows("train_v08.jsonl")
          val = rows("validation_v08.jsonl")
          locked = rows("hard_test.jsonl") + rows("external_test_v5.jsonl") + rows("test.jsonl")

          h = lambda r: hashlib.sha256(r["code"].encode()).hexdigest()
          train_h = {h(r) for r in train}
          val_h = {h(r) for r in val}
          locked_h = {h(r) for r in locked}
          assert not (train_h & val_h)
          assert not (train_h & locked_h)
          assert not (val_h & locked_h)
          print(json.dumps({
              "train": len(train),
              "validation": len(val),
              "train_locked_overlap": len(train_h & locked_h),
              "validation_locked_overlap": len(val_h & locked_h),
          }, indent=2))
          PY

      - name: Fetch pinned repository-disjoint real-world sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external

          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD

          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD

          git init external/sanitize-html
          git -C external/sanitize-html remote add origin https://github.com/apostrophecms/sanitize-html.git
          git -C external/sanitize-html fetch --depth 1 origin "$SANITIZE_HTML_SHA"
          git -C external/sanitize-html checkout --detach FETCH_HEAD

      - name: Build independent real-world curriculum
        run: |
          uv run python security-models/xss/scripts/build_v08_realworld.py             --firing-range-root external/firing-range             --dompurify-root external/DOMPurify             --sanitize-html-root external/sanitize-html             --external-test security-models/xss/data/external_test_v5.jsonl             --output-dir security-models/xss/data             --seed 2029             --validation-fraction 0.20             | tee security-models/xss/evaluation/v09_realworld_build.log

      - name: Train v0.9 balanced generalization candidate
        run: |
          rm -rf security-models/xss/adapters/xss-v09
          uv run --group lora python training/train_peft.py             --base-model nreimers/MiniLM-L6-H384-uncased             --train-data security-models/xss/data/train_v08.jsonl             --validation-data security-models/xss/data/validation_v08.jsonl             --extra-train-data security-models/xss/data/realworld_train_v08.jsonl             --extra-train-weight 1.5             --extra-train-copies 2             --extra-validation-data security-models/xss/data/realworld_validation_v08.jsonl             --extra-validation-copies 1             --output-dir security-models/xss/adapters/xss-v09             --adapter-name xss-v0.9             --target-modules "query,key,value,attention.output.dense"             --epochs 2             --batch-size 16             --max-length 256             --rank 8             --alpha 16             --dropout 0.05             --lr 1e-4             --seed 2029 2>&1 | tee security-models/xss/evaluation/v09_training.log

      - name: Register v0.9 locally
        run: |
          uv run python - <<'PY'
          from xss_specialist.adapter_registry import default_registry, register_adapter
          reg = default_registry()
          register_adapter(
              reg,
              name="xss-v0.9",
              kind="peft",
              base_model="nreimers/MiniLM-L6-H384-uncased",
              path="security-models/xss/adapters/xss-v09",
              description="v0.9 balanced contrastive + repository-disjoint real-world candidate; not promoted.",
              promoted=False,
              activate=False,
          )
          PY

      - name: Evaluate held-out real-world validation
        run: |
          uv run --group lora python security-models/xss/evaluation/evaluate_external_v5.py             --adapter xss-v0.9             --data security-models/xss/data/realworld_validation_v08.jsonl             --output security-models/xss/evaluation/v09_realworld_validation.json             --predictions security-models/xss/evaluation/v09_realworld_validation_predictions.jsonl

      - name: Hard Test v4
        run: |
          uv run --group lora python security-models/xss/evaluation/evaluate.py             --adapter xss-v0.9             --output security-models/xss/evaluation/v09_hard.json

      - name: External Test v5
        run: |
          uv run --group lora python security-models/xss/evaluation/evaluate_external_v5.py             --adapter xss-v0.9             --output security-models/xss/evaluation/v09_external.json             --predictions security-models/xss/evaluation/v09_external_predictions.jsonl

      - name: Build v0.9 summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          root = Path("security-models/xss")
          def load(path):
              return json.loads(path.read_text()) if path.exists() else {}

          contrast = load(root / "data/manifest_v08.json")
          real = load(root / "data/realworld_v08_manifest.json")
          meta = load(root / "adapters/xss-v09/adapter_metadata.json")
          realval = load(root / "evaluation/v09_realworld_validation.json")
          hard = load(root / "evaluation/v09_hard.json")
          ext = load(root / "evaluation/v09_external.json")

          out = {
              "candidate": "xss-v0.9",
              "promoted": False,
              "contrast_corpus": contrast,
              "realworld_curriculum": real,
              "training": {
                  "best_validation_metric": meta.get("best_metric"),
                  "train_rows": meta.get("train_rows"),
                  "validation_rows": meta.get("validation_rows"),
                  "extra_train_rows_unique": meta.get("extra_train_rows_unique"),
                  "extra_train_weight": meta.get("extra_train_weight"),
                  "extra_train_copies": meta.get("extra_train_copies"),
                  "runtime_seconds": meta.get("runtime_seconds"),
                  "lora": meta.get("lora"),
                  "external_test_v5_used_for_training": meta.get("external_test_v5_used_for_training"),
              },
              "realworld_validation": {
                  "count": realval.get("count"),
                  "coverage": realval.get("coverage"),
                  "decided_macro_f1": realval.get("decided_macro_f1"),
                  "xss_false_positive_rate_all": realval.get("xss_false_positive_rate_all"),
                  "xss_false_negative_rate_all": realval.get("xss_false_negative_rate_all"),
              },
              "hard_test_v4": {
                  "macro_f1": hard.get("classification_report", {}).get("macro avg", {}).get("f1-score"),
                  "promotion": hard.get("promotion"),
                  "false_rates": hard.get("false_rates"),
              },
              "external_test_v5": {
                  "count": ext.get("count"),
                  "coverage": ext.get("coverage"),
                  "decided_macro_f1": ext.get("decided_macro_f1"),
                  "xss_false_positive_rate_all": ext.get("xss_false_positive_rate_all"),
                  "xss_false_negative_rate_all": ext.get("xss_false_negative_rate_all"),
                  "promotion": ext.get("promotion"),
              },
          }
          out["eligible_for_promotion"] = bool(
              out["hard_test_v4"].get("promotion", {}).get("passed")
              and out["external_test_v5"].get("promotion", {}).get("passed")
          )
          path = root / "evaluation/v09_summary.json"
          path.write_text(json.dumps(out, indent=2) + "\n")
          print(path.read_text())
          PY

      - name: Upload v0.9 candidate and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xss-v09-candidate
          retention-days: 30
          if-no-files-found: warn
          path: |
            security-models/xss/adapters/xss-v09/
            security-models/xss/data/train_v08.jsonl
            security-models/xss/data/validation_v08.jsonl
            security-models/xss/data/manifest_v08.json
            security-models/xss/data/realworld_train_v08.jsonl
            security-models/xss/data/realworld_validation_v08.jsonl
            security-models/xss/data/realworld_v08_manifest.json
            security-models/xss/evaluation/v09_*.log
            security-models/xss/evaluation/v09_*.json
            security-models/xss/evaluation/v09_*_predictions.jsonl
