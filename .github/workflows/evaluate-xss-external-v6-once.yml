name: External v6 One-Shot v4d

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-xss-external-v6-once.yml"
      - "evaluation/evaluate_external_v6_once.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-external-v6-one-shot
  cancel-in-progress: false

env:
  SEMANTIC_RUN_ID: "36900022333"
  SEMANTIC_ARTIFACT: "xss-sink-v4d-lr3e4-e12"
  FLOW_RUN_ID: "36867388302"
  FLOW_ARTIFACT: "xss-flow-v2-candidate-f0-lr3e5-e8"
  HTMX_SHA: "fa978b24e75fb03c137bf2cdae4fef0e711cf8a1"
  MUSTACHE_SHA: "972fd2b27a036888acfcb60d6119317744fac7ee"
  KOA_SHA: "824c1cf8de9a91a2941973b25dc8a3d3029b9e4f"
  ROUTER_SHA: "a6090382ed467b5a2d46c8de1a13b331f14959f8"
  TURBO_SHA: "75350a19212ef0d29a0e6db75e0bfdeb96b10cd7"

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev
      - name: Compile frozen evaluator
        run: uv run python -m py_compile evaluation/evaluate_external_v6_once.py
      - name: Fetch frozen repositories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external
          fetch_repo() {
            local dir="$1"; local url="$2"; local sha="$3"
            git init "external/$dir"
            git -C "external/$dir" remote add origin "$url"
            git -C "external/$dir" fetch --depth 1 origin "$sha"
            git -C "external/$dir" checkout --detach FETCH_HEAD
          }
          fetch_repo htmx https://github.com/bigskysoftware/htmx.git "$HTMX_SHA"
          fetch_repo mustache https://github.com/janl/mustache.js.git "$MUSTACHE_SHA"
          fetch_repo koa https://github.com/koajs/koa.git "$KOA_SHA"
          fetch_repo react-router https://github.com/remix-run/react-router.git "$ROUTER_SHA"
          fetch_repo turbo https://github.com/hotwired/turbo.git "$TURBO_SHA"
      - name: Verify frozen selection without scoring
        run: |
          uv run --group slm python evaluation/evaluate_external_v6_once.py \
            --htmx-root external/htmx \
            --mustache-root external/mustache \
            --koa-root external/koa \
            --react-router-root external/react-router \
            --turbo-root external/turbo \
            --select-only

  score:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev
      - name: Download frozen v4d semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEMANTIC_ARTIFACT }}
          path: semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}
      - name: Download frozen flow checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: flow
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}
      - name: Locate frozen checkpoints
        id: locate
        shell: bash
        run: |
          SEM="$(find semantic -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find flow -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"; test -n "$FLOW"
          echo "semantic=$SEM" >> "$GITHUB_OUTPUT"
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"
      - name: Fetch exact same frozen repositories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external
          fetch_repo() {
            local dir="$1"; local url="$2"; local sha="$3"
            git init "external/$dir"
            git -C "external/$dir" remote add origin "$url"
            git -C "external/$dir" fetch --depth 1 origin "$sha"
            git -C "external/$dir" checkout --detach FETCH_HEAD
          }
          fetch_repo htmx https://github.com/bigskysoftware/htmx.git "$HTMX_SHA"
          fetch_repo mustache https://github.com/janl/mustache.js.git "$MUSTACHE_SHA"
          fetch_repo koa https://github.com/koajs/koa.git "$KOA_SHA"
          fetch_repo react-router https://github.com/remix-run/react-router.git "$ROUTER_SHA"
          fetch_repo turbo https://github.com/hotwired/turbo.git "$TURBO_SHA"
      - name: Score External v6 exactly once
        run: |
          uv run --group slm python evaluation/evaluate_external_v6_once.py \
            --htmx-root external/htmx \
            --mustache-root external/mustache \
            --koa-root external/koa \
            --react-router-root external/react-router \
            --turbo-root external/turbo \
            --semantic-dir "${{ steps.locate.outputs.semantic }}" \
            --flow-dir "${{ steps.locate.outputs.flow }}" \
            --output reports/xss-external-v6-one-shot.json
      - name: Seal one-shot metadata
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/xss-external-v6-seal.json")
          p.write_text(json.dumps({
              "schema":"xss-external-v6-seal",
              "protocol":"LOCKED BEFORE CASE INSPECTION",
              "semantic_run_id":"36900022333",
              "semantic_artifact":"xss-sink-v4d-lr3e4-e12",
              "flow_run_id":"36867388302",
              "flow_artifact":"xss-flow-v2-candidate-f0-lr3e5-e8",
              "thresholds_frozen_before_score":{
                  "system_primary_accuracy":0.80,
                  "model_advice_primary_accuracy":0.60,
                  "minimum_family_system_accuracy":0.50
              },
              "row_level_failures_quarantined":True,
              "promotion_allowed":False
          },indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-external-v6-one-shot
          retention-days: 90
          path: |
            reports/xss-external-v6-one-shot.json
            reports/xss-external-v6-seal.json
