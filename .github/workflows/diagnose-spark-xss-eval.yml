name: Diagnose Spark XSS Kaggle Evaluation Status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose-xss-eval]')
    name: Fetch Kaggle status, logs and results without GPU rerun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Kaggle kernel status and download finished results only
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Missing KAGGLE_API_TOKEN"; exit 1
          fi
          python -m pip install -q "git+https://github.com/Kaggle/kaggle-cli.git@9c57dd74c29904c40ff7879eed33644be89d2e2f"
          mkdir -p diagnostics/output
          kernel="dody2004/spark-xss-independent-evaluation"
          kaggle kernels status "$kernel" > diagnostics/kaggle-status.txt 2>&1 || true
          kaggle kernels logs "$kernel" > diagnostics/kaggle-logs.txt 2>&1 || true
          echo "=== Latest Kaggle status ==="
          cat diagnostics/kaggle-status.txt
          if grep -Eqi 'KernelWorkerStatus.RUNNING|KernelWorkerStatus.QUEUED' diagnostics/kaggle-status.txt; then
            echo "::notice::Kaggle still active; skipping output download. No new GPU job was started."
          else
            timeout 420 kaggle kernels output "$kernel" -p diagnostics/output -o > diagnostics/download.txt 2>&1 || true
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("diagnostics")
          logs=(root/"kaggle-logs.txt").read_text(errors="replace")
          highlights=[
              ln for ln in logs.splitlines()
              if any(word in ln.lower() for word in (
                  "traceback", "error", "exception", "cuda", "accelerator",
                  "no such", "not found", "kernelworkerstatus", "runtimeerror",
                  "missing", "failed", "attributeerror", "valueerror",
              ))
          ]
          print("=== Kaggle STATUS ===")
          print((root/"kaggle-status.txt").read_text(errors="replace")[-1500:])
          print("=== Most recent suspicious log lines ===")
          print("\n".join(highlights[-50:])[-12000:] or "No exception lines detected")
          print("=== Tail ===")
          print("\n".join(logs.splitlines()[-45:])[-10000:])
          print("=== Evaluation artifacts ===")
          for name in ("report.json", "status.json"):
              matches=list((root/"output").rglob(name))
              print(name, [(str(path),path.stat().st_size) for path in matches if path.is_file()])
          if (root/"download.txt").is_file():
              print("Download diagnostics:", (root/"download.txt").read_text(errors="replace")[-2500:])
          for path in (root/"output").rglob("status.json"):
              try:
                  obj=json.loads(path.read_text())
                  if "evaluated" in obj or "promotion" in obj:
                      print("=== EVALUATOR STATUS ===")
                      print(json.dumps(obj, indent=2))
              except (ValueError, OSError):
                  pass
          PY
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-xss-kaggle-error-diagnostics-${{ github.run_id }}
          path: diagnostics
          retention-days: 14
          if-no-files-found: warn
