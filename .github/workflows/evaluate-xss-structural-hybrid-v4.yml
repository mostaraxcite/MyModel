name: Evaluate XSS Structural Hybrid v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-xss-structural-hybrid-v4.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-structural-hybrid-v4-eval
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "36872169684"
  SEMANTIC_ARTIFACT: "xss-structural-v4-semantic-s-lr5e5-e8"
  FLOW_ARTIFACT: "xss-structural-v4-flow-f-lr3e5-e8"
  FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
  DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev
      - name: Compile hybrid path
        run: |
          uv run python -m py_compile \
            xss_specialist/semantic_oracle.py \
            xss_specialist/flow_relations.py \
            xss_specialist/field_advisor.py \
            evaluation/evaluate_structural_field_v4_real.py
      - name: Download trained semantic candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEMANTIC_ARTIFACT }}
          path: semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download trained canonical flow winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: flow
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Locate artifacts
        id: locate
        shell: bash
        run: |
          SEM="$(find semantic -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find flow -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"; test -n "$FLOW"
          echo "semantic=$SEM" >> "$GITHUB_OUTPUT"
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned independent real upstream sources
        shell: bash
        run: |
          mkdir -p external
          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD
          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD
      - name: Evaluate hybrid on real upstream cases
        run: |
          uv run --group slm python evaluation/evaluate_structural_field_v4_real.py \
            --semantic-dir "${{ steps.locate.outputs.semantic }}" \
            --flow-dir "${{ steps.locate.outputs.flow }}" \
            --firing-range-root external/firing-range \
            --dompurify-root external/DOMPurify \
            --output reports/xss-structural-hybrid-v4-real.json
      - name: Enforce research gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/xss-structural-hybrid-v4-real.json").read_text())
          print(json.dumps({
              "metrics":r["metrics"],
              "tuple_accuracy":r["tuple_accuracy"],
              "research_gate_passed":r["research_gate_passed"],
              "promotion_allowed":r["promotion_allowed"],
          },indent=2))
          if not r["research_gate_passed"]:
              raise SystemExit("hybrid real-upstream gate failed")
          PY
      - name: Build hybrid bundle
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts/xss-structural-hybrid-v4/semantic artifacts/xss-structural-hybrid-v4/flow
          cp -R "${{ steps.locate.outputs.semantic }}"/. artifacts/xss-structural-hybrid-v4/semantic/
          cp -R "${{ steps.locate.outputs.flow }}"/. artifacts/xss-structural-hybrid-v4/flow/
          cp reports/xss-structural-hybrid-v4-real.json artifacts/xss-structural-hybrid-v4/
          python - <<'PY'
          import json
          from pathlib import Path
          cfg={
              "schema":"xss-structural-hybrid-v4",
              "semantic_candidate":"s-lr5e5-e8",
              "flow_candidate":"f-lr3e5-e8",
              "semantic_model_component_gate_passed":False,
              "flow_model_component_gate_passed":True,
              "deterministic_semantic_primary":True,
              "deterministic_flow_primary":True,
              "neural_role":"fallback_advice_only",
              "model_can_confirm_xss":False,
              "browser_execution_required_for_confirmation":True,
              "locked_hard_or_external_used":False,
              "promotion_allowed":False,
          }
          Path("artifacts/xss-structural-hybrid-v4/config.json").write_text(json.dumps(cfg,indent=2)+"\n")
          print(json.dumps(cfg,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-structural-hybrid-v4
          retention-days: 30
          path: |
            reports/xss-structural-hybrid-v4-real.json
            artifacts/xss-structural-hybrid-v4/
