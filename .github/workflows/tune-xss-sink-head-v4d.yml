name: Tune XSS Sink Head v4d

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tune-xss-sink-head-v4d.yml"
      - "training/augment_sink_v4d.py"
      - "training/train_sink_head_v4d.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-sink-head-v4d
  cancel-in-progress: true

env:
  PREP_RUN_ID: "36872169684"
  BASE_MODEL_RUN_ID: "36897522395"
  BASE_MODEL_ARTIFACT: "xss-semantic-v4c-lr8e5-e12"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: lr1e4-e8
            lr: 0.00010
            epochs: 8
          - slug: lr2e4-e10
            lr: 0.00020
            epochs: 10
          - slug: lr3e4-e12
            lr: 0.00030
            epochs: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download prepared v4 data
        uses: actions/download-artifact@v4
        with:
          name: xss-structural-field-v4-prepared
          path: prepared
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREP_RUN_ID }}

      - name: Download best v4c semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_MODEL_ARTIFACT }}
          path: base-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_MODEL_RUN_ID }}

      - name: Locate inputs
        id: locate
        shell: bash
        run: |
          TRAIN="$(find prepared -type f -path '*/semantic-field-v4/train.jsonl' | head -1)"
          DEV="$(find prepared -type f -path '*/semantic-field-v4/dev.jsonl' | head -1)"
          MODEL="$(find base-model -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          test -n "$TRAIN"; test -n "$DEV"; test -n "$MODEL"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Add targeted sink hard examples
        run: |
          uv run python training/augment_sink_v4d.py \
            --base-train "${{ steps.locate.outputs.train }}" \
            --output data/sink-v4d/train.jsonl \
            --repeat 12 \
            --seed 10091

      - name: Verify dev remains untouched
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("${{ steps.locate.outputs.dev }}")
          print("dev_sha256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Fine-tune sink head only
        run: |
          OUT="artifacts/xss-sink-v4d-${{ matrix.slug }}"
          uv run --group slm python training/train_sink_head_v4d.py \
            --checkpoint "${{ steps.locate.outputs.model }}" \
            --train data/sink-v4d/train.jsonl \
            --dev "${{ steps.locate.outputs.dev }}" \
            --output-dir "$OUT" \
            --epochs ${{ matrix.epochs }} \
            --batch-size 64 \
            --max-length 96 \
            --lr ${{ matrix.lr }} \
            --seed 10092

      - name: Strict gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug="${{ matrix.slug }}"
          root=Path(f"artifacts/xss-sink-v4d-{slug}")
          b=json.loads((root/"best_metrics.json").read_text())["dev"]
          mins={
              t:min(b[t]["per_class_f1"].values())
              for t in ("source","sink","defense")
          }
          passed=bool(
              b["source"]["macro_f1"]>=.90 and
              b["sink"]["macro_f1"]>=.90 and
              b["defense"]["macro_f1"]>=.85 and
              mins["source"]>=.70 and
              mins["sink"]>=.70 and
              mins["defense"]>=.60
          )
          out={
              "slug":slug,
              "passed":passed,
              "source":b["source"],
              "sink":b["sink"],
              "defense":b["defense"],
              "mins":mins,
              "promotion_allowed":False,
              "locked_hard_or_external_used":False,
          }
          (root/"candidate_score.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-sink-v4d-${{ matrix.slug }}
          retention-days: 30
          path: artifacts/xss-sink-v4d-${{ matrix.slug }}/

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-sink-v4d-*
          path: candidates

      - name: Select strict winner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("candidates").rglob("candidate_score.json")]
          if len(rows)!=3:
              raise RuntimeError(f"expected 3 candidates, got {len(rows)}")
          rows.sort(
              key=lambda r:(r["passed"],r["sink"]["macro_f1"],min(r["sink"]["per_class_f1"].values())),
              reverse=True,
          )
          winner=rows[0]
          summary={
              "schema":"xss-sink-head-v4d-selection",
              "candidates":rows,
              "winner":winner,
              "research_gate_passed":bool(winner["passed"]),
              "promotion_allowed":False,
              "locked_hard_or_external_used":False,
              "next_gate":"real upstream hybrid integration with canonical flow",
          }
          Path("xss_sink_v4d_selection.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          if not winner["passed"]:
              raise SystemExit("sink-head v4d strict gate failed")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-sink-v4d-selection
          retention-days: 30
          path: xss_sink_v4d_selection.json
