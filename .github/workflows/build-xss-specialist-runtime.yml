name: Build XSS Specialist Runtime Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xss-specialist-runtime.yml"
      - "runtime/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: xss-specialist-runtime-release
  cancel-in-progress: true

env:
  SEMANTIC_RUN_ID: "36920030570"
  SEMANTIC_ARTIFACT: "xss-source-v4e-lr25e5-e12"
  FLOW_RUN_ID: "36867388302"
  FLOW_ARTIFACT: "xss-flow-v2-candidate-f0-lr3e5-e8"
  RELEASE_TAG: "xss-specialist-runtime-v1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download semantic v4e winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEMANTIC_ARTIFACT }}
          path: _semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download flow v2 winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: _flow
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Assemble runtime-only tree
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="dist/xss-specialist-runtime-v1"
          mkdir -p "$ROOT/models/semantic-v4e" "$ROOT/models/flow-v2"

          cp -a xss_specialist "$ROOT/"
          cp -a live "$ROOT/"
          cp -a verification "$ROOT/"
          cp -a runtime "$ROOT/"
          cp pyproject.toml "$ROOT/"
          test -f uv.lock && cp uv.lock "$ROOT/" || true
          test -f LICENSE && cp LICENSE "$ROOT/" || true
          cp runtime/README.md "$ROOT/README.md"

          SEM_ROOT="$(find _semantic -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW_ROOT="$(find _flow -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM_ROOT"
          test -n "$FLOW_ROOT"

          cp -a "$SEM_ROOT/." "$ROOT/models/semantic-v4e/"
          cp -a "$FLOW_ROOT/." "$ROOT/models/flow-v2/"

          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          test -f "$ROOT/models/semantic-v4e/dual_branch_config.json"
          test -f "$ROOT/models/flow-v2/flow_branch_config.json"

      - name: Write frozen release manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path("dist/xss-specialist-runtime-v1")
          files=[]
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              files.append({
                  "path":p.relative_to(root).as_posix(),
                  "bytes":p.stat().st_size,
                  "sha256":h,
              })

          manifest={
              "schema":"xss-specialist-runtime-v1",
              "semantic":{
                  "run_id":36920030570,
                  "artifact":"xss-source-v4e-lr25e5-e12",
                  "source_macro_f1":1.0,
                  "sink_macro_f1":0.9861111111111112,
                  "defense_macro_f1":0.9156462585034014,
              },
              "flow":{
                  "run_id":36867388302,
                  "artifact":"xss-flow-v2-candidate-f0-lr3e5-e8",
              },
              "external_v7":{
                  "run_id":36922054415,
                  "system_primary_accuracy":0.90,
                  "model_advice_primary_accuracy":0.90,
                  "research_gate_passed":True,
              },
              "authority":{
                  "model_can_confirm_xss":False,
                  "browser_execution_required_for_confirmation":True,
              },
              "contains_training_data":False,
              "contains_external_v6_rows":False,
              "contains_external_v7_rows":False,
              "files":files,
          }
          (root/"release.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps({k:v for k,v in manifest.items() if k!="files"},indent=2))
          print("files",len(files))
          PY

      - name: Archive runtime
        shell: bash
        run: |
          cd dist
          zip -qr xss-specialist-runtime-v1.zip xss-specialist-runtime-v1
          sha256sum xss-specialist-runtime-v1.zip | tee xss-specialist-runtime-v1.zip.sha256
          ls -lh xss-specialist-runtime-v1.zip

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: xss-specialist-runtime-v1
          retention-days: 90
          path: |
            dist/xss-specialist-runtime-v1.zip
            dist/xss-specialist-runtime-v1.zip.sha256

      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          NOTES="Frozen runtime-only XSS Specialist bundle. Semantic v4e winner + Flow v2 + deterministic authority + Browser Oracle. External v7: 90% system / 90% model advice. No training datasets or external row-level benchmark data."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               dist/xss-specialist-runtime-v1.zip               dist/xss-specialist-runtime-v1.zip.sha256               --clobber
          else
            gh release create "$RELEASE_TAG"               dist/xss-specialist-runtime-v1.zip               dist/xss-specialist-runtime-v1.zip.sha256               --title "XSS Specialist Runtime v1"               --notes "$NOTES"
          fi
