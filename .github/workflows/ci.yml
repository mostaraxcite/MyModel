name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Compile Python sources
        run: uv run python -m compileall -q xss_specialist training evaluation kaggle/spark_xss_eval.py kaggle/spark_xss_train_v2.py kaggle/spark_xss_eval_v2.py kaggle/spark_xss_evidence_v3_train.py kaggle/spark_evidence_v3_eval.py security-models/xss
      - name: Run core regression tests
        run: >
          uv run pytest -q
          tests/test_router.py
          tests/test_xss_v05.py
          tests/test_v05_fixes.py
          tests/test_pipeline.py
          tests/test_taint_v1.py
          tests/test_flow_relations.py
          tests/test_spark_xss_training.py
          tests/test_kaggle_xss_kernel.py
          tests/test_spark_xss_independent_eval.py
          tests/test_spark_xss_v2_data.py
          tests/test_spark_xss_v2_evaluator.py
          tests/test_evidence_first.py
          tests/test_spark_evidence_v3.py
          tests/test_spark_evidence_v3_kernel.py
          tests/test_evidence_v3_regression.py
          tests/test_evidence_source_transforms.py
          tests/test_spark_evidence_v3_model_eval.py
          tests/test_grounded_advisor.py
          tests/test_fresh_static_xss_suite.py
          tests/test_fresh_html_context_fixes.py
          tests/test_xss_flow_callbacks_loops_urls_v5.py
          tests/test_xss_v5_frozen_audit_manifest.py
          tests/test_xss_async_timer_text_v6.py
          tests/test_xss_scope_url_v7.py
          tests/test_xss_helpers_handlers_loops_v8.py
      - name: Score new diagnostic XSS cases (audit partition remains unscored)
        run: uv run python -m evaluation.fresh_static_xss_suite --partition diagnostic
      - name: Audit conservative XSS evidence gate on exposed regression
        run: uv run python -m evaluation.evidence_v3_regression

  kaggle-cli-smoke:
    name: Verify pinned Kaggle CLI publish-without-run support
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned upstream CLI
        run: python -m pip install -q "git+https://github.com/Kaggle/kaggle-cli.git@9c57dd74c29904c40ff7879eed33644be89d2e2f"
      - name: Verify --no-run recognized without Kaggle credentials
        run: |
          kaggle kernels push --help | grep -F -- '--no-run'
          kaggle kernels push --help | grep -F -- '--accelerator'

  xss-v7-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded oracle and browser dependencies
        run: python -m pip install tree-sitter==0.25.2 tree-sitter-javascript==0.25.0 playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify exposed synthetic browser regression
        run: >
          python -m evaluation.xss_scope_url_v7_evaluate
          --cases evaluation/fixtures/xss_scope_url_v7_regression.jsonl
          --output results/xss-v7-browser-regression.json
          --regression-gate
      - name: Verify V7 audit as exposed V8 browser regression
        run: >
          python -m evaluation.xss_scope_url_v7_evaluate
          --cases evaluation/fixtures/xss_scope_url_v7_fresh.jsonl
          --output results/xss-v8-browser-regression.json
          --regression-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-v7-browser-regression
          path: |
            results/xss-v7-browser-regression.json
            results/xss-v8-browser-regression.json

  xss-v8-fresh-synthetic-audit:
    # Score this frozen engine/case partition only on the initial PR-open
    # event. Later runs use exposed regressions, not a fresh accuracy claim.
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded oracle and browser dependencies
        run: python -m pip install tree-sitter==0.25.2 tree-sitter-javascript==0.25.0 playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Score frozen fresh synthetic fixtures once
        run: >
          python -m evaluation.xss_scope_url_v7_evaluate
          --cases evaluation/fixtures/xss_helpers_handlers_loops_v8_fresh.jsonl
          --manifest evaluation/fixtures/xss_helpers_handlers_loops_v8_fresh_manifest.json
          --output results/xss-v8-fresh-report.json
      - name: Print case evidence for immutable audit retrieval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('results/xss-v8-fresh-report.json').read_text())
          report['results']=[{k:row[k] for k in ('id','label','family','code','static_status','browser')} for row in report['results']]
          print('V8_FROZEN_EVIDENCE='+json.dumps(report,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-v8-fresh-synthetic-audit
          path: results/xss-v8-fresh-report.json
