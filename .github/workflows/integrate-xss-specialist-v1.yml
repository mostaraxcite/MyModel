name: Integrate XSS Semantic + Flow v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-xss-specialist-v1.yml"
      - "xss_specialist/dual_branch_review.py"
      - "evaluation/evaluate_integrated_real_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-integrated-v1
  cancel-in-progress: true

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
  DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"
  SEMANTIC_RUN_ID: "36844398034"
  FLOW_RUN_ID: "36867388302"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: semantic-s2e5
            semantic_artifact: xss-dual-branch-v2-candidate-v2-s2e5-f1e5-r24
          - slug: semantic-s3e5
            semantic_artifact: xss-dual-branch-v2-candidate-v2-s3e5-f2e5-r16

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Compile integrated path
        run: |
          uv run python -m py_compile \
            xss_specialist/dual_branch_review.py \
            evaluation/evaluate_integrated_real_v1.py

      - name: Download semantic artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.semantic_artifact }}
          path: semantic-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download winning flow artifact
        uses: actions/download-artifact@v4
        with:
          name: xss-flow-v2-candidate-f0-lr3e5-e8
          path: flow-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Locate model roots
        id: models
        shell: bash
        run: |
          SEM="$(find semantic-artifact -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find flow-artifact -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"
          test -n "$FLOW"
          test -f "$SEM/semantic_heads.pt"
          test -f "$FLOW/flow_head.pt"
          echo "semantic=$SEM" >> "$GITHUB_OUTPUT"
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned independent real XSS sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external

          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD

          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD

      - name: Evaluate integrated real upstream benchmark
        run: |
          OUT="reports/xss-integrated-v1-${{ matrix.slug }}.json"
          uv run --group slm python evaluation/evaluate_integrated_real_v1.py \
            --semantic-model-dir "${{ steps.models.outputs.semantic }}" \
            --flow-model-dir "${{ steps.models.outputs.flow }}" \
            --firing-range-root external/firing-range \
            --dompurify-root external/DOMPurify \
            --output "$OUT"

      - name: Score integration candidate
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          slug = "${{ matrix.slug }}"
          report = json.loads(Path(f"reports/xss-integrated-v1-{slug}.json").read_text())
          metrics = report["metrics"]
          score = (
              0.20 * metrics["source"]["macro_f1_present"]
              + 0.20 * metrics["sink"]["macro_f1_present"]
              + 0.25 * metrics["defense"]["macro_f1_present"]
              + 0.25 * metrics["flow"]["macro_f1_present"]
              + 0.10 * report["tuple_accuracy"]
          )
          out = {
              "slug": slug,
              "semantic_artifact": "${{ matrix.semantic_artifact }}",
              "flow_artifact": "xss-flow-v2-candidate-f0-lr3e5-e8",
              "research_gate_passed": report["research_gate_passed"],
              "score": score,
              "metrics": metrics,
              "tuple_accuracy": report["tuple_accuracy"],
              "case_count": report["case_count"],
              "locked_hard_or_external_used": False,
              "promotion_allowed": False,
          }
          Path(f"reports/xss-integrated-v1-{slug}-score.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-integrated-v1-candidate-${{ matrix.slug }}
          retention-days: 30
          path: |
            reports/xss-integrated-v1-${{ matrix.slug }}.json
            reports/xss-integrated-v1-${{ matrix.slug }}-score.json

  select:
    needs: candidate
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
      semantic_artifact: ${{ steps.pick.outputs.semantic_artifact }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-integrated-v1-candidate-*
          path: candidates
          merge-multiple: false

      - name: Select real-benchmark winner
        id: pick
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = [
              json.loads(p.read_text())
              for p in Path("candidates").rglob("*-score.json")
          ]
          if len(rows) != 2:
              raise RuntimeError(f"expected 2 integration scores, got {len(rows)}")

          rows.sort(
              key=lambda r: (
                  r["research_gate_passed"],
                  r["score"],
                  r["metrics"]["defense"]["macro_f1_present"],
                  r["metrics"]["sink"]["macro_f1_present"],
              ),
              reverse=True,
          )
          winner = rows[0]
          summary = {
              "schema": "xss-integrated-v1-selection",
              "candidates": rows,
              "winner": winner,
              "research_gate_passed": bool(winner["research_gate_passed"]),
              "promotion_allowed": False,
              "locked_hard_or_external_used": False,
          }
          Path("xss_integrated_v1_selection.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"slug={winner['slug']}\n")
              f.write(f"semantic_artifact={winner['semantic_artifact']}\n")
          if not winner["research_gate_passed"]:
              raise SystemExit("Integrated real-world research gate did not pass.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-integrated-v1-selection
          retention-days: 30
          path: xss_integrated_v1_selection.json

  bundle:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download selected semantic artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.select.outputs.semantic_artifact }}
          path: selected-semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download selected flow artifact
        uses: actions/download-artifact@v4
        with:
          name: xss-flow-v2-candidate-f0-lr3e5-e8
          path: selected-flow
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Build integrated advisory bundle
        shell: bash
        run: |
          SEM="$(find selected-semantic -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find selected-flow -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"
          test -n "$FLOW"

          mkdir -p artifacts/xss-integrated-v1/semantic artifacts/xss-integrated-v1/flow
          cp -R "$SEM"/. artifacts/xss-integrated-v1/semantic/
          cp -R "$FLOW"/. artifacts/xss-integrated-v1/flow/

          python - <<'PY'
          import json
          from pathlib import Path

          cfg = {
              "schema": "xss-integrated-v1",
              "semantic": "semantic",
              "flow": "flow",
              "semantic_candidate": "${{ needs.select.outputs.slug }}",
              "flow_candidate": "f0-lr3e5-e8",
              "model_can_confirm_xss": False,
              "browser_execution_required_for_confirmation": True,
              "promotion_allowed": False,
              "locked_hard_or_external_used": False,
          }
          Path("artifacts/xss-integrated-v1/integrated_config.json").write_text(
              json.dumps(cfg, indent=2) + "\n"
          )
          print(json.dumps(cfg, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-integrated-v1-bundle
          retention-days: 30
          path: artifacts/xss-integrated-v1/
