name: Verify XSS Specialist End-to-End

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-xss-specialist-e2e.yml"
      - "xss_specialist/system.py"
      - "xss_specialist/semantic_oracle.py"
      - "xss_specialist/flow_relations.py"
      - "xss_specialist/taint.py"
      - "live/pipeline.py"
      - "live/findings.py"
      - "live/probes.py"
      - "live/executor.py"
      - "verification/browser_oracle.py"
      - "tests/test_specialist_system.py"
      - "tests/test_specialist_system_browser.py"

permissions:
  contents: read

concurrency:
  group: xss-specialist-e2e
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Compile unified specialist
        run: |
          uv run python -m py_compile \
            xss_specialist/system.py \
            xss_specialist/semantic_oracle.py \
            xss_specialist/flow_relations.py \
            verification/browser_oracle.py

      - name: Run authority-boundary tests
        run: |
          uv run pytest -q \
            tests/test_specialist_system.py \
            tests/test_specialist_system_browser.py \
            tests/test_semantic_oracle.py \
            tests/test_live_browser.py

      - name: Run focused taint regressions
        run: uv run pytest -q tests/test_taint_v1.py tests/test_flow_relations.py
