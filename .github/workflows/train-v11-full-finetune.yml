name: Train XSS v0.11 Full Fine-tune

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-v11-full-finetune.yml"

permissions:
  contents: read

concurrency:
  group: xss-v11-full-finetune
  cancel-in-progress: false

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
  DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"
  SANITIZE_HTML_SHA: "6ac6b8ea4898c2ba7f843d8cdd5f7d036d760a0e"

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Regression tests
        run: >
          uv run pytest -q
          tests/test_router.py
          tests/test_xss_v05.py
          tests/test_v05_fixes.py
          tests/test_pipeline.py

      - name: Build clean v0.10/v0.11 development corpus
        run: |
          uv run python security-models/xss/scripts/build_v10_generalization_dataset.py \
            --seed 2031 \
            --groups 1800 \
            --legacy-per-label 1800 \
            --validation-fraction 0.18 \
            | tee security-models/xss/evaluation/v11_data_build.log

      - name: Fetch pinned independent real-world sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external

          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD

          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD

          git init external/sanitize-html
          git -C external/sanitize-html remote add origin https://github.com/apostrophecms/sanitize-html.git
          git -C external/sanitize-html fetch --depth 1 origin "$SANITIZE_HTML_SHA"
          git -C external/sanitize-html checkout --detach FETCH_HEAD

      - name: Build repository-disjoint real-world development split
        run: |
          uv run python security-models/xss/scripts/build_v08_realworld.py \
            --firing-range-root external/firing-range \
            --dompurify-root external/DOMPurify \
            --sanitize-html-root external/sanitize-html \
            --external-test security-models/xss/data/external_test_v5.jsonl \
            --output-dir security-models/xss/data \
            --seed 2031 \
            --validation-fraction 0.20 \
            | tee security-models/xss/evaluation/v11_realworld_build.log

      - name: Verify no locked-set overlap
        run: |
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = Path("security-models/xss/data")

          def read(name):
              return [json.loads(x) for x in (data / name).read_text().splitlines() if x]

          train = read("train_v10.jsonl")
          val = read("validation_v10.jsonl")
          locked = read("test.jsonl") + read("hard_test.jsonl") + read("external_test_v5.jsonl")
          h = lambda r: hashlib.sha256(r["code"].encode()).hexdigest()
          train_h = {h(r) for r in train}
          val_h = {h(r) for r in val}
          locked_h = {h(r) for r in locked}
          assert not (train_h & val_h)
          assert not (train_h & locked_h)
          assert not (val_h & locked_h)
          print(json.dumps({
              "train": len(train),
              "validation": len(val),
              "train_locked_overlap": len(train_h & locked_h),
              "validation_locked_overlap": len(val_h & locked_h),
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v11-prepared-data
          retention-days: 14
          path: |
            security-models/xss/data/train_v10.jsonl
            security-models/xss/data/validation_v10.jsonl
            security-models/xss/data/manifest_v10.json
            security-models/xss/data/realworld_train_v08.jsonl
            security-models/xss/data/realworld_validation_v08.jsonl
            security-models/xss/data/realworld_v08_manifest.json
            security-models/xss/evaluation/v11_data_build.log
            security-models/xss/evaluation/v11_realworld_build.log

  reproduce-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: bert-tiny
            model: google/bert_uncased_L-4_H-256_A-4
          - slug: minilm
            model: nreimers/MiniLM-L6-H384-uncased
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Full fine-tune exact v0.4 recipe
        run: |
          OUT="security-models/xss/full-models/v11-control-${{ matrix.slug }}"
          rm -rf "$OUT"
          uv run --group slm python training/train_full_encoder.py \
            --model "${{ matrix.model }}" \
            --train-data security-models/xss/data/train.jsonl \
            --validation-data security-models/xss/data/validation.jsonl \
            --output-dir "$OUT" \
            --run-name "v11-control-${{ matrix.slug }}" \
            --epochs 5 \
            --batch-size 32 \
            --max-length 128 \
            --lr 3e-5 \
            --seed 1337

      - name: Evaluate locked Hard Test only
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "security-models/xss/full-models/v11-control-${{ matrix.slug }}" \
            --data security-models/xss/data/hard_test.jsonl \
            --output "security-models/xss/evaluation/v11_control_${{ matrix.slug }}_hard.json"

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v11-control-${{ matrix.slug }}
          retention-days: 30
          path: |
            security-models/xss/full-models/v11-control-${{ matrix.slug }}/training_metadata.json
            security-models/xss/evaluation/v11_control_${{ matrix.slug }}_hard.json

  candidate:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: bert-tiny
            model: google/bert_uncased_L-4_H-256_A-4
          - slug: minilm
            model: nreimers/MiniLM-L6-H384-uncased
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download clean development data
        uses: actions/download-artifact@v4
        with:
          name: xss-v11-prepared-data
          path: security-models/xss

      - name: Full fine-tune candidate
        run: |
          OUT="security-models/xss/full-models/v11-${{ matrix.slug }}"
          rm -rf "$OUT"
          uv run --group slm python training/train_full_encoder.py \
            --model "${{ matrix.model }}" \
            --train-data security-models/xss/data/train_v10.jsonl \
            --validation-data security-models/xss/data/validation_v10.jsonl \
            --extra-train-data security-models/xss/data/realworld_train_v08.jsonl \
            --extra-validation-data security-models/xss/data/realworld_validation_v08.jsonl \
            --output-dir "$OUT" \
            --run-name "xss-v0.11-${{ matrix.slug }}" \
            --epochs 5 \
            --batch-size 32 \
            --max-length 128 \
            --lr 3e-5 \
            --seed 2031

      - name: Evaluate clean three-way validation
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "security-models/xss/full-models/v11-${{ matrix.slug }}" \
            --data security-models/xss/data/validation_v10.jsonl \
            --output "security-models/xss/evaluation/v11_${{ matrix.slug }}_validation.json"

      - name: Evaluate independent real-world validation
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "security-models/xss/full-models/v11-${{ matrix.slug }}" \
            --data security-models/xss/data/realworld_validation_v08.jsonl \
            --output "security-models/xss/evaluation/v11_${{ matrix.slug }}_realworld.json" \
            --external-binary

      - name: Score development candidate
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          slug = "${{ matrix.slug }}"
          root = Path("security-models/xss/evaluation")
          val = json.loads((root / f"v11_{slug}_validation.json").read_text())
          real = json.loads((root / f"v11_{slug}_realworld.json").read_text())
          report = val["classification_report"]
          macro = float(report["macro avg"]["f1-score"])
          recalls = {k: float(report[k]["recall"]) for k in ("SAFE", "POSSIBLE_XSS", "XSS")}
          min_recall = min(recalls.values())
          real_macro = float(real["decided_macro_f1"])
          real_coverage = float(real["coverage"])
          viable = (
              macro >= 0.78
              and recalls["SAFE"] >= 0.70
              and recalls["POSSIBLE_XSS"] >= 0.65
              and recalls["XSS"] >= 0.70
              and real_macro >= 0.55
              and real_coverage >= 0.75
          )
          score = 0.50 * macro + 0.25 * min_recall + 0.25 * real_macro
          out = {
              "slug": slug,
              "model": "${{ matrix.model }}",
              "macro_f1": macro,
              "recalls": recalls,
              "min_class_recall": min_recall,
              "realworld_macro_f1": real_macro,
              "realworld_coverage": real_coverage,
              "selection_score": score,
              "viable": viable,
          }
          path = root / f"v11_{slug}_score.json"
          path.write_text(json.dumps(out, indent=2) + "\n")
          print(path.read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v11-candidate-${{ matrix.slug }}
          retention-days: 30
          path: |
            security-models/xss/full-models/v11-${{ matrix.slug }}/
            security-models/xss/evaluation/v11_${{ matrix.slug }}_validation.json
            security-models/xss/evaluation/v11_${{ matrix.slug }}_realworld.json
            security-models/xss/evaluation/v11_${{ matrix.slug }}_score.json

  select:
    needs: candidate
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
      model: ${{ steps.pick.outputs.model }}
      score: ${{ steps.pick.outputs.score }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xss-v11-candidate-bert-tiny
          path: candidates/bert-tiny
      - uses: actions/download-artifact@v4
        with:
          name: xss-v11-candidate-minilm
          path: candidates/minilm

      - name: Select only a viable development winner
        id: pick
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = []
          for slug in ("bert-tiny", "minilm"):
              matches = list((Path("candidates") / slug).rglob(f"v11_{slug}_score.json"))
              if len(matches) != 1:
                  raise RuntimeError(f"missing score for {slug}: {matches}")
              rows.append(json.loads(matches[0].read_text()))

          viable = [r for r in rows if r["viable"]]
          if not viable:
              summary = {"candidates": rows, "winner": None, "stopped": True}
              Path("v11_selection.json").write_text(json.dumps(summary, indent=2) + "\n")
              print(json.dumps(summary, indent=2))
              raise SystemExit("No v0.11 full-finetune candidate passed development viability gates.")

          viable.sort(key=lambda r: (r["selection_score"], r["min_class_recall"], r["macro_f1"]), reverse=True)
          winner = viable[0]
          summary = {"candidates": rows, "winner": winner, "stopped": False}
          Path("v11_selection.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"slug={winner['slug']}\n")
              f.write(f"model={winner['model']}\n")
              f.write(f"score={winner['selection_score']}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v11-selection
          retention-days: 30
          path: v11_selection.json

  final-eval:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WINNER_SLUG: ${{ needs.select.outputs.slug }}
      WINNER_MODEL: ${{ needs.select.outputs.model }}
      WINNER_SCORE: ${{ needs.select.outputs.score }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download selected candidate
        uses: actions/download-artifact@v4
        with:
          name: xss-v11-candidate-${{ needs.select.outputs.slug }}
          path: selected

      - name: Locate selected model
        id: model
        run: |
          MODEL_DIR="$(find selected -type f -name config.json -printf '%h\n' | head -1)"
          test -n "$MODEL_DIR"
          echo "dir=$MODEL_DIR" >> "$GITHUB_OUTPUT"
          echo "Selected model directory: $MODEL_DIR"

      - name: Final Hard Test v4
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "${{ steps.model.outputs.dir }}" \
            --data security-models/xss/data/hard_test.jsonl \
            --output security-models/xss/evaluation/v11_hard.json

      - name: Final External Test v5
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "${{ steps.model.outputs.dir }}" \
            --data security-models/xss/data/external_test_v5.jsonl \
            --output security-models/xss/evaluation/v11_external.json \
            --external-binary

      - name: Build final diagnosis
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("security-models/xss/evaluation")
          hard = json.loads((root / "v11_hard.json").read_text())
          ext = json.loads((root / "v11_external.json").read_text())
          out = {
              "candidate": "xss-v0.11",
              "training": "full_finetune",
              "winner_slug": os.environ["WINNER_SLUG"],
              "base_model": os.environ["WINNER_MODEL"],
              "development_selection_score": float(os.environ["WINNER_SCORE"]),
              "hard_test_v4": {
                  "macro_f1": hard["classification_report"]["macro avg"]["f1-score"],
                  "promotion": hard["promotion"],
                  "false_rates": hard["false_rates"],
              },
              "external_test_v5": {
                  "coverage": ext["coverage"],
                  "decided_macro_f1": ext["decided_macro_f1"],
                  "xss_false_positive_rate_all": ext["xss_false_positive_rate_all"],
                  "xss_false_negative_rate_all": ext["xss_false_negative_rate_all"],
                  "promotion": ext["promotion"],
              },
          }
          out["eligible_for_promotion"] = bool(
              out["hard_test_v4"]["promotion"]["passed"]
              and out["external_test_v5"]["promotion"]["passed"]
          )
          (root / "v11_summary.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v11-final
          retention-days: 30
          path: |
            security-models/xss/evaluation/v11_hard.json
            security-models/xss/evaluation/v11_external.json
            security-models/xss/evaluation/v11_summary.json
