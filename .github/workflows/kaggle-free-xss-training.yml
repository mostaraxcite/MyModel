name: Kaggle Free GPU - Spark XSS

on:
  workflow_dispatch:
    inputs:
      kaggle_username:
        description: "Exact Kaggle username from kaggle.com/code/OWNER/slug (not Kaggle)"
        required: true
        default: "dody2004"
        type: string
      mode:
        description: "Package only; publish without running; or experimental API submit"
        required: true
        type: choice
        default: package
        options:
          - package
          - publish
          - submit

permissions:
  contents: read

concurrency:
  group: spark-xss-kaggle-${{ github.ref }}-${{ inputs.kaggle_username }}
  cancel-in-progress: false

jobs:
  kaggle:
    name: Package pinned XSS training kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebook owner from Kaggle URL
        env:
          KAGGLE_OWNER: ${{ inputs.kaggle_username }}
        run: |
          if [ "${KAGGLE_OWNER,,}" = "kaggle" ]; then
            echo "::error::Enter your real Kaggle username from the notebook URL (currently dody2004), not Kaggle."
            exit 1
          fi
      - name: Test packaging on CPU (does not train)
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_kaggle_xss_kernel.py
      - name: Package private Kaggle kernel pinned to this commit
        env:
          KAGGLE_OWNER: ${{ inputs.kaggle_username }}
          MYMODEL_SHA: ${{ github.sha }}
        run: |
          python scripts/build_kaggle_xss_kernel.py \
            --owner "$KAGGLE_OWNER" \
            --sha "$MYMODEL_SHA" \
            --output-dir kaggle-dist
          python -m py_compile kaggle-dist/spark_xss_train.py
      - name: Save source + metadata without exposing Kaggle credentials
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-spark-xss-kernel-${{ github.run_id }}
          path: |
            kaggle-dist/spark_xss_train.py
            kaggle-dist/kernel-metadata.json
            kaggle-dist/packaging-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Check Kaggle API connection for explicitly requested submission
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'package'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Add the Kaggle API token as repository Actions secret KAGGLE_API_TOKEN. No training has been submitted."
            exit 1
          fi
      - name: Publish to Kaggle; manual GPU activation recommended
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'submit'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_OWNER: ${{ inputs.kaggle_username }}
          SUBMIT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade kaggle
          if [ "$SUBMIT_MODE" = "publish" ]; then
            kaggle kernels push -p kaggle-dist --no-run --accelerator NvidiaTeslaT4 --timeout 18000
            echo "::notice::Kernel saved WITHOUT execution. Open Kaggle editor, enable GPU T4 x2 and Internet, then Save Version > Save & Run All."
          else
            kaggle kernels push -p kaggle-dist --accelerator NvidiaTeslaT4 --timeout 18000
            echo "::warning::Kaggle accepted the version. This does NOT prove a GPU was allocated or training started. Verify Accelerator in Kaggle Logs."
          fi
          echo "Open your notebook: https://www.kaggle.com/code/$KAGGLE_OWNER/spark-xss-qlora-kaggle"
          kaggle kernels status "$KAGGLE_OWNER/spark-xss-qlora-kaggle" || true
