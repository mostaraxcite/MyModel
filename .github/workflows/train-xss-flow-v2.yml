name: Train XSS Flow Branch v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-xss-flow-v2.yml"
      - "data/flow-relations-v2/source_manifest.json"
      - "training/build_flow_relations_v2.py"
      - "training/train_flow_branch_v2.py"
      - "xss_specialist/dual_branch.py"
      - "xss_specialist/flow_relations.py"

permissions:
  contents: read

concurrency:
  group: xss-flow-branch-v2
  cancel-in-progress: true

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Compile flow v2 path
        run: |
          uv run python -m py_compile \
            xss_specialist/dual_branch.py \
            xss_specialist/flow_relations.py \
            training/build_flow_relations_v2.py \
            training/train_flow_branch_v2.py

      - name: Core regression tests
        run: >
          uv run pytest -q
          tests/test_flow_relations.py
          tests/test_taint_v1.py
          tests/test_xss_v04.py

      - name: Reproduce successful v0.4 checkpoint exactly
        run: |
          rm -rf security-models/xss/v04-flow-v2-backbone
          uv run --group slm python security-models/xss/scripts/train.py \
            --data-dir security-models/xss/data \
            --output-dir security-models/xss/v04-flow-v2-backbone \
            --model google/bert_uncased_L-4_H-256_A-4 \
            --epochs 5 \
            --batch-size 32 \
            --seed 1337

      - name: Build native flow-relations v2 corpus
        run: |
          rm -rf data/flow-relations-v2/sources \
                 data/flow-relations-v2/train.jsonl \
                 data/flow-relations-v2/dev.jsonl \
                 data/flow-relations-v2/build_report.json
          uv run python training/build_flow_relations_v2.py \
            --manifest data/flow-relations-v2/source_manifest.json \
            --output-dir data/flow-relations-v2 \
            --train-per-class-per-repo 60 \
            --dev-per-class-per-repo 40 \
            --min-train-per-class 120 \
            --min-dev-per-class 45

      - name: Show corpus report
        run: cat data/flow-relations-v2/build_report.json

      - uses: actions/upload-artifact@v4
        with:
          name: xss-flow-v2-prepared
          retention-days: 14
          path: |
            security-models/xss/v04-flow-v2-backbone/
            data/flow-relations-v2/source_manifest.json
            data/flow-relations-v2/train.jsonl
            data/flow-relations-v2/dev.jsonl
            data/flow-relations-v2/build_report.json
            data/flow-relations-v2/sources/

  candidate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: f0-lr1e5-e8
            freeze: 0
            lr: 0.00001
            epochs: 8
            class_power: 0.0
          - slug: f0-lr2e5-e8
            freeze: 0
            lr: 0.00002
            epochs: 8
            class_power: 0.0
          - slug: f0-lr3e5-e8
            freeze: 0
            lr: 0.00003
            epochs: 8
            class_power: 0.0
          - slug: f1-lr2e5-e10
            freeze: 1
            lr: 0.00002
            epochs: 10
            class_power: 0.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download prepared corpus and v0.4
        uses: actions/download-artifact@v4
        with:
          name: xss-flow-v2-prepared
          path: prepared

      - name: Locate prepared paths
        id: locate
        shell: bash
        run: |
          BACKBONE="$(find prepared -type f -path '*/v04-flow-v2-backbone/config.json' -printf '%h\n' | head -1)"
          if [ -z "$BACKBONE" ]; then
            BACKBONE="$(find prepared -type f -name config.json -path '*v04-flow-v2-backbone*' ! -path '*/checkpoint-*/*' -printf '%h\n' | head -1)"
          fi
          TRAIN="$(find prepared -type f -path '*flow-relations-v2/train.jsonl' | head -1)"
          DEV="$(find prepared -type f -path '*flow-relations-v2/dev.jsonl' | head -1)"
          test -n "$BACKBONE"
          test -n "$TRAIN"
          test -n "$DEV"
          echo "backbone=$BACKBONE" >> "$GITHUB_OUTPUT"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"

      - name: Train standalone flow branch
        run: |
          OUT="artifacts/xss-flow-v2-${{ matrix.slug }}"
          uv run --group slm python training/train_flow_branch_v2.py \
            --backbone "${{ steps.locate.outputs.backbone }}" \
            --train "${{ steps.locate.outputs.train }}" \
            --dev "${{ steps.locate.outputs.dev }}" \
            --output-dir "$OUT" \
            --epochs ${{ matrix.epochs }} \
            --batch-size 32 \
            --max-length 128 \
            --lr ${{ matrix.lr }} \
            --freeze-layers ${{ matrix.freeze }} \
            --class-balance-power ${{ matrix.class_power }} \
            --seed 6061

      - name: Gate flow branch
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          slug = "${{ matrix.slug }}"
          root = Path(f"artifacts/xss-flow-v2-{slug}")
          best = json.loads((root / "best_metrics.json").read_text())["dev"]
          report = json.loads((root / "training_report.json").read_text())

          macro = float(best["macro_f1"])
          accuracy = float(best["accuracy"])
          recalls = {
              name: float(values["recall"])
              for name, values in best["per_class"].items()
          }
          min_recall = min(recalls.values())

          viable = bool(
              macro >= 0.60
              and min_recall >= 0.50
          )

          result = {
              "slug": slug,
              "viable": viable,
              "macro_f1": macro,
              "accuracy": accuracy,
              "recalls": recalls,
              "min_recall": min_recall,
              "architecture": report["architecture"],
              "locked_external_used": report["locked_external_used"],
              "final_judge": report["final_judge"],
          }
          (root / "candidate_score.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-flow-v2-candidate-${{ matrix.slug }}
          retention-days: 30
          path: artifacts/xss-flow-v2-${{ matrix.slug }}/

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-flow-v2-candidate-*
          path: candidates
          merge-multiple: false

      - name: Select best flow candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(path.read_text())
              for path in Path("candidates").rglob("candidate_score.json")
          ]
          if len(rows) != 4:
              raise RuntimeError(f"expected 4 candidate scores, got {len(rows)}")

          rows.sort(
              key=lambda r: (
                  r["viable"],
                  r["macro_f1"],
                  r["min_recall"],
                  r["accuracy"],
              ),
              reverse=True,
          )
          winner = rows[0]
          summary = {
              "schema": "xss-flow-v2-selection",
              "candidates": rows,
              "winner": winner,
              "research_gate_passed": bool(winner["viable"]),
              "promotion_allowed": False,
              "locked_hard_or_external_used": False,
              "next_gate": "combine with semantic branch then independent real XSS integration evaluation",
          }
          Path("xss_flow_v2_selection.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          if not winner["viable"]:
              raise SystemExit("No flow-v2 candidate passed the research gate.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-flow-v2-selection
          retention-days: 30
          path: xss_flow_v2_selection.json
