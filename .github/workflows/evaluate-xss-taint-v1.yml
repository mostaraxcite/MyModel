name: Evaluate XSS Taint v1 Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-xss-taint-v1.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Run deterministic taint tests
        run: |
          uv run pytest -q tests/test_taint_v1.py tests/test_flow_relations.py

      - name: Evaluate deterministic taint engine on External Test v5
        run: |
          uv run python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          from xss_specialist.taint import analyze
          from xss_specialist.taint_evaluation import score

          path = Path("security-models/xss/data/external_test_v5.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]

          overall = score(rows)
          verdicts = Counter()
          confusion = Counter()
          by_repo = defaultdict(list)
          by_suffix = defaultdict(list)
          limitations = Counter()

          for row in rows:
              result = analyze(row["code"])
              verdict = result["verdict"]
              verdicts[verdict] += 1
              confusion[(row["label"], verdict)] += 1
              for item in result.get("limitations", []):
                  msg = item.split(": ", 1)[-1]
                  limitations[msg] += 1

              repo = row.get("project") or row.get("provenance", {}).get("repository") or "unknown"
              by_repo[repo].append(row)

              source_path = row.get("provenance", {}).get("path", "")
              suffix = Path(source_path).suffix.lower() or "none"
              by_suffix[suffix].append(row)

          result = {
              "engine": "xss-taint-v1",
              "dataset": "external_test_v5_locked",
              "count": len(rows),
              "overall": overall,
              "verdict_counts": dict(verdicts),
              "confusion": {
                  f"{truth}->{pred}": count
                  for (truth, pred), count in sorted(confusion.items())
              },
              "by_repository": {name: score(items) for name, items in sorted(by_repo.items())},
              "by_source_suffix": {name: score(items) for name, items in sorted(by_suffix.items())},
              "top_limitations": limitations.most_common(20),
              "training_used": False,
              "ml_final_judge": False,
              "note": "One-shot architecture baseline only; do not tune against individual locked-test rows.",
          }

          out = Path("security-models/xss/evaluation/taint_v1_external_baseline.json")
          out.write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-taint-v1-external-baseline
          retention-days: 30
          path: security-models/xss/evaluation/taint_v1_external_baseline.json
