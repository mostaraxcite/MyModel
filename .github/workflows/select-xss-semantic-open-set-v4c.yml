name: Select XSS Semantic Open-Set v4c

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/select-xss-semantic-open-set-v4c.yml"
      - "evaluation/select_semantic_open_set_v4c.py"
      - "xss_specialist/semantic_oracle.py"
      - "xss_specialist/flow_relations.py"
      - "xss_specialist/field_advisor.py"
      - "evaluation/evaluate_structural_field_v4_real.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-semantic-open-set-v4c
  cancel-in-progress: true

env:
  SEMANTIC_RUN_ID: "36873436362"
  FLOW_RUN_ID: "36872169684"
  FLOW_ARTIFACT: "xss-structural-v4-flow-f-lr3e5-e8"
  FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
  DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
      artifact: ${{ steps.pick.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download v4b semantic candidates
        uses: actions/download-artifact@v4
        with:
          pattern: xss-semantic-v4b-*
          path: candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Apply open-set semantic policy
        run: |
          uv run python evaluation/select_semantic_open_set_v4c.py \
            --candidates-root candidates \
            --output reports/xss-semantic-open-set-v4c-selection.json

      - name: Resolve selected artifact
        id: pick
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open("reports/xss-semantic-open-set-v4c-selection.json"))
          w=r["winner"]
          slug=w["slug"]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"slug={slug}\n")
              f.write(f"artifact=xss-semantic-v4b-{slug}\n")
          print(json.dumps(w,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-semantic-open-set-v4c-selection
          retention-days: 30
          path: reports/xss-semantic-open-set-v4c-selection.json

  integrate:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download selected semantic model
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.select.outputs.artifact }}
          path: semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download canonical flow winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: flow
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Locate model roots
        id: locate
        shell: bash
        run: |
          SEM="$(find semantic -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find flow -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"; test -n "$FLOW"
          echo "semantic=$SEM" >> "$GITHUB_OUTPUT"
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned real upstream sources
        shell: bash
        run: |
          mkdir -p external
          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD

          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD

      - name: Re-evaluate real structural hybrid
        run: |
          uv run --group slm python evaluation/evaluate_structural_field_v4_real.py \
            --semantic-dir "${{ steps.locate.outputs.semantic }}" \
            --flow-dir "${{ steps.locate.outputs.flow }}" \
            --firing-range-root external/firing-range \
            --dompurify-root external/DOMPurify \
            --output reports/xss-structural-hybrid-v4c-real.json

          python - <<'PY'
          import json
          r=json.load(open("reports/xss-structural-hybrid-v4c-real.json"))
          print(json.dumps({
              "metrics":r["metrics"],
              "tuple_accuracy":r["tuple_accuracy"],
              "research_gate_passed":r["research_gate_passed"]
          },indent=2))
          if not r["research_gate_passed"]:
              raise SystemExit("real hybrid gate failed")
          PY

      - name: Build v4c research bundle
        shell: bash
        run: |
          mkdir -p artifacts/xss-structural-hybrid-v4c/semantic artifacts/xss-structural-hybrid-v4c/flow
          cp -R "${{ steps.locate.outputs.semantic }}"/. artifacts/xss-structural-hybrid-v4c/semantic/
          cp -R "${{ steps.locate.outputs.flow }}"/. artifacts/xss-structural-hybrid-v4c/flow/
          cp reports/xss-structural-hybrid-v4c-real.json artifacts/xss-structural-hybrid-v4c/

          python - <<'PY'
          import json
          from pathlib import Path
          cfg={
              "schema":"xss-structural-hybrid-v4c",
              "semantic_candidate":"${{ needs.select.outputs.slug }}",
              "flow_candidate":"f-lr3e5-e8",
              "semantic_policy":"known-class closed-set + OTHER open-set abstention",
              "deterministic_semantic_primary":True,
              "deterministic_flow_primary":True,
              "neural_role":"advisory fallback only",
              "model_can_confirm_xss":False,
              "browser_execution_required_for_confirmation":True,
              "locked_hard_or_external_used":False,
              "promotion_allowed":False
          }
          Path("artifacts/xss-structural-hybrid-v4c/config.json").write_text(
              json.dumps(cfg,indent=2)+"\n"
          )
          print(json.dumps(cfg,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-structural-hybrid-v4c
          retention-days: 30
          path: |
            reports/xss-structural-hybrid-v4c-real.json
            artifacts/xss-structural-hybrid-v4c/
