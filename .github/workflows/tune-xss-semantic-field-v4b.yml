name: Tune XSS Semantic Field v4b

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tune-xss-semantic-field-v4b.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-semantic-field-v4b
  cancel-in-progress: true

env:
  PREP_RUN_ID: "36872169684"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: lr7e5-e12
            lr: 0.00007
            epochs: 12
          - slug: lr8e5-e14
            lr: 0.00008
            epochs: 14
          - slug: lr1e4-e12
            lr: 0.00010
            epochs: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev
      - name: Download prepared v4 assets
        uses: actions/download-artifact@v4
        with:
          name: xss-structural-field-v4-prepared
          path: prepared
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREP_RUN_ID }}
      - name: Locate inputs
        id: locate
        shell: bash
        run: |
          BACKBONE="$(find prepared -type f -path '*/v04/config.json' -printf '%h\n' | head -1)"
          TRAIN="$(find prepared -type f -path '*/semantic-field-v4/train.jsonl' | head -1)"
          DEV="$(find prepared -type f -path '*/semantic-field-v4/dev.jsonl' | head -1)"
          test -n "$BACKBONE"; test -n "$TRAIN"; test -n "$DEV"
          echo "backbone=$BACKBONE" >> "$GITHUB_OUTPUT"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
      - name: Train stronger semantic candidate
        run: |
          OUT="artifacts/xss-semantic-v4b-${{ matrix.slug }}"
          uv run --group slm python training/train_semantic_field_v4.py \
            --backbone "${{ steps.locate.outputs.backbone }}" \
            --train "${{ steps.locate.outputs.train }}" \
            --dev "${{ steps.locate.outputs.dev }}" \
            --output-dir "$OUT" \
            --epochs ${{ matrix.epochs }} \
            --batch-size 48 \
            --max-length 96 \
            --lr ${{ matrix.lr }} \
            --class-power 0.35 \
            --seed 8084
      - name: Strict component gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug="${{ matrix.slug }}"
          root=Path(f"artifacts/xss-semantic-v4b-{slug}")
          b=json.loads((root/"best_metrics.json").read_text())["dev"]
          t=b["tasks"]
          mins={k:min(t[k]["per_class_f1"].values()) for k in ("source","sink","defense")}
          passed=bool(
              t["source"]["macro_f1"]>=.90 and
              t["sink"]["macro_f1"]>=.90 and
              t["defense"]["macro_f1"]>=.85 and
              mins["source"]>=.70 and
              mins["sink"]>=.70 and
              mins["defense"]>=.60
          )
          out={"slug":slug,"passed":passed,"mean":b["mean_macro_f1"],
               "source":t["source"],"sink":t["sink"],"defense":t["defense"],
               "mins":mins,"promotion_allowed":False,
               "locked_hard_or_external_used":False}
          (root/"candidate_score.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xss-semantic-v4b-${{ matrix.slug }}
          retention-days: 30
          path: artifacts/xss-semantic-v4b-${{ matrix.slug }}/

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-semantic-v4b-*
          path: candidates
      - name: Select strict winner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("candidates").rglob("candidate_score.json")]
          if len(rows)!=3: raise RuntimeError(f"expected 3, got {len(rows)}")
          rows.sort(key=lambda r:(r["passed"],r["mean"],r["sink"]["macro_f1"],r["source"]["macro_f1"]),reverse=True)
          w=rows[0]
          out={"schema":"xss-semantic-field-v4b-selection","candidates":rows,"winner":w,
               "research_gate_passed":bool(w["passed"]),"promotion_allowed":False,
               "locked_hard_or_external_used":False}
          Path("xss_semantic_field_v4b_selection.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not w["passed"]: raise SystemExit("semantic v4b strict gate failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-semantic-field-v4b-selection
          retention-days: 30
          path: xss_semantic_field_v4b_selection.json
