name: Create XSS Specialist Repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-xss-specialist-repo.yml"

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt account-level repository creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh repo create mostaraxcite/XSS-Specialist             --public             --description "Runtime-only XSS Specialist: semantic v4e + Flow v2 + deterministic and browser oracles"
