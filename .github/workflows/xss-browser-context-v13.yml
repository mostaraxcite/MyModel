name: XSS collected browser context
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collected-browser-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest tree-sitter==0.25.2 tree-sitter-javascript==0.25.0 playwright==1.55.0
      - run: python -m pytest -q tests/test_browser_context_evidence_v13.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m evaluation.browser_context_v13_regression --output results/xss-browser-context-v13.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-browser-context-v13
          path: results/xss-browser-context-v13.json
