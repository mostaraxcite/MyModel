name: Train XSS MultiTask v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-xss-multitask-v1.yml"

permissions:
  contents: read

concurrency:
  group: xss-multitask-v1
  cancel-in-progress: true

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Compile new multi-task path
        run: |
          uv run python -m py_compile \
            xss_specialist/multitask.py \
            training/build_multitask_xss_data.py \
            training/train_multitask_xss.py

      - name: Core regression tests
        run: >
          uv run pytest -q
          tests/test_xss_v04.py
          tests/test_taint_v1.py
          tests/test_flow_relations.py
          tests/test_pipeline.py

      - name: Reproduce successful v0.4 checkpoint
        run: |
          rm -rf security-models/xss/v04-multitask-backbone
          uv run --group slm python security-models/xss/scripts/train.py \
            --data-dir security-models/xss/data \
            --output-dir security-models/xss/v04-multitask-backbone \
            --model google/bert_uncased_L-4_H-256_A-4 \
            --epochs 5 \
            --batch-size 32 \
            --seed 1337

      - name: Build masked multi-task dataset
        run: |
          rm -rf data/multitask-v1
          uv run python training/build_multitask_xss_data.py \
            --train-per-template 160 \
            --dev-per-template 100 \
            --output-dir data/multitask-v1

      - name: Show dataset manifest
        run: cat data/multitask-v1/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: xss-multitask-v1-prepared
          retention-days: 14
          path: |
            security-models/xss/v04-multitask-backbone/
            data/multitask-v1/train.jsonl
            data/multitask-v1/dev.jsonl
            data/multitask-v1/manifest.json

  candidate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: f0-lr1e5
            freeze: 0
            lr: 0.00001
            flow_weight: 20
          - slug: f1-lr1e5
            freeze: 1
            lr: 0.00001
            flow_weight: 20
          - slug: f2-lr1e5
            freeze: 2
            lr: 0.00001
            flow_weight: 20
          - slug: f1-lr2e5
            freeze: 1
            lr: 0.00002
            flow_weight: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download prepared v0.4 backbone and data
        uses: actions/download-artifact@v4
        with:
          name: xss-multitask-v1-prepared
          path: prepared

      - name: Locate prepared paths
        id: locate
        shell: bash
        run: |
          BACKBONE="$(find prepared -type f -path '*/v04-multitask-backbone/config.json' -printf '%h\n' | head -1)"
          if [ -z "$BACKBONE" ]; then
            BACKBONE="$(find prepared -type f -name config.json -path '*v04-multitask-backbone*' ! -path '*/checkpoint-*/*' -printf '%h\n' | head -1)"
          fi
          TRAIN="$(find prepared -type f -path '*multitask-v1/train.jsonl' | head -1)"
          DEV="$(find prepared -type f -path '*multitask-v1/dev.jsonl' | head -1)"
          test -n "$BACKBONE"
          test -n "$TRAIN"
          test -n "$DEV"
          echo "backbone=$BACKBONE" >> "$GITHUB_OUTPUT"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"

      - name: Train direct PyTorch multi-task model
        run: |
          OUT="artifacts/xss-multitask-v1-${{ matrix.slug }}"
          uv run --group slm python training/train_multitask_xss.py \
            --backbone "${{ steps.locate.outputs.backbone }}" \
            --train-data "${{ steps.locate.outputs.train }}" \
            --dev-data "${{ steps.locate.outputs.dev }}" \
            --output-dir "$OUT" \
            --epochs 5 \
            --batch-size 32 \
            --max-length 128 \
            --lr ${{ matrix.lr }} \
            --freeze-layers ${{ matrix.freeze }} \
            --flow-sample-weight ${{ matrix.flow_weight }} \
            --seed 4041

      - name: Gate component model
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          slug = "${{ matrix.slug }}"
          root = Path(f"artifacts/xss-multitask-v1-{slug}")
          report = json.loads((root / "training_report.json").read_text())
          best = json.loads((root / "best_metrics.json").read_text())["dev"]
          tasks = best["tasks"]

          source = float(tasks["source"]["macro_f1"])
          sink = float(tasks["sink"]["macro_f1"])
          defense = float(tasks["defense"]["macro_f1"])
          flow = float(tasks["flow"]["macro_f1"])
          weighted = float(best["weighted_macro_f1"])

          viable = bool(
              source >= 0.90
              and sink >= 0.90
              and defense >= 0.85
              and flow >= 0.55
              and weighted >= 0.78
          )

          result = {
              "slug": slug,
              "viable": viable,
              "weighted_macro_f1": weighted,
              "source_macro_f1": source,
              "sink_macro_f1": sink,
              "defense_macro_f1": defense,
              "flow_macro_f1": flow,
              "flow_accuracy": tasks["flow"]["accuracy"],
              "architecture": report["architecture"],
              "whole_snippet_classifier_loss": report["whole_snippet_classifier_loss"],
          }
          path = root / "candidate_score.json"
          path.write_text(json.dumps(result, indent=2) + "\n")
          print(path.read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-multitask-v1-candidate-${{ matrix.slug }}
          retention-days: 30
          path: artifacts/xss-multitask-v1-${{ matrix.slug }}/

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-multitask-v1-candidate-*
          path: candidates
          merge-multiple: false

      - name: Select best component candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in Path("candidates").rglob("candidate_score.json"):
              rows.append(json.loads(path.read_text()))
          if len(rows) != 4:
              raise RuntimeError(f"expected 4 candidate scores, got {len(rows)}")

          rows.sort(
              key=lambda r: (
                  r["viable"],
                  r["weighted_macro_f1"],
                  r["flow_macro_f1"],
                  r["sink_macro_f1"],
              ),
              reverse=True,
          )
          winner = rows[0]
          summary = {
              "schema": "xss-multitask-v1-selection",
              "candidates": rows,
              "winner": winner,
              "research_gate_passed": bool(winner["viable"]),
              "promotion_allowed": False,
              "next_gate": "independent real XSS relation corpus + deterministic/browser integration",
          }
          Path("xss_multitask_v1_selection.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          if not winner["viable"]:
              raise SystemExit("No multi-task candidate passed the research component gate.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-multitask-v1-selection
          retention-days: 30
          path: xss_multitask_v1_selection.json
