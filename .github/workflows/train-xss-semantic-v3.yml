name: Train XSS Semantic v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-xss-semantic-v3.yml"
      - "training/build_semantic_v3.py"
      - "training/train_semantic_v3.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-semantic-v3
  cancel-in-progress: true

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  V04_RUN_ID: "36844398034"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev
      - name: Compile semantic v3
        run: |
          uv run python -m py_compile \
            training/build_semantic_v3.py \
            training/train_semantic_v3.py
      - name: Reuse exact v0.4 backbone
        uses: actions/download-artifact@v4
        with:
          name: xss-dual-branch-v2-prepared
          path: reused-v04
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V04_RUN_ID }}
      - name: Materialize v0.4
        shell: bash
        run: |
          BACKBONE="$(find reused-v04 -type f -path '*/v04-dual-branch-backbone/config.json' -printf '%h\n' | head -1)"
          test -n "$BACKBONE"
          mkdir -p prepared
          cp -R "$BACKBONE" prepared/v04
      - name: Build class-complete semantic corpus
        run: |
          uv run python training/build_semantic_v3.py \
            --output-dir data/semantic-v3 \
            --train-per-template 80 \
            --dev-per-template 50 \
            --seed 7071
      - name: Verify every class is represented
        run: |
          python - <<'PY'
          import json
          m=json.load(open("data/semantic-v3/manifest.json"))
          assert m["exact_text_overlap"] == 0
          assert not m["template_overlap"]
          for split in ("train","dev"):
              for task in ("source","sink","defense"):
                  assert all(v > 0 for v in m[split][task].values()), (split,task,m[split][task])
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xss-semantic-v3-prepared
          retention-days: 14
          path: |
            prepared/v04/
            data/semantic-v3/train.jsonl
            data/semantic-v3/dev.jsonl
            data/semantic-v3/manifest.json

  candidate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: lr2e5-e8
            lr: 0.00002
            epochs: 8
            freeze: 0
            power: 0.30
          - slug: lr3e5-e8
            lr: 0.00003
            epochs: 8
            freeze: 0
            power: 0.30
          - slug: lr4e5-e8
            lr: 0.00004
            epochs: 8
            freeze: 0
            power: 0.35
          - slug: lr3e5-e10-f1
            lr: 0.00003
            epochs: 10
            freeze: 1
            power: 0.30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --group slm --group dev
      - name: Download prepared semantic data
        uses: actions/download-artifact@v4
        with:
          name: xss-semantic-v3-prepared
          path: prepared
      - name: Locate prepared files
        id: locate
        shell: bash
        run: |
          BACKBONE="$(find prepared -type f -path '*/v04/config.json' -printf '%h\n' | head -1)"
          TRAIN="$(find prepared -type f -path '*/semantic-v3/train.jsonl' | head -1)"
          DEV="$(find prepared -type f -path '*/semantic-v3/dev.jsonl' | head -1)"
          test -n "$BACKBONE"; test -n "$TRAIN"; test -n "$DEV"
          echo "backbone=$BACKBONE" >> "$GITHUB_OUTPUT"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
      - name: Train semantic branch
        run: |
          OUT="artifacts/xss-semantic-v3-${{ matrix.slug }}"
          uv run --group slm python training/train_semantic_v3.py \
            --backbone "${{ steps.locate.outputs.backbone }}" \
            --train "${{ steps.locate.outputs.train }}" \
            --dev "${{ steps.locate.outputs.dev }}" \
            --output-dir "$OUT" \
            --epochs ${{ matrix.epochs }} \
            --batch-size 32 \
            --max-length 128 \
            --lr ${{ matrix.lr }} \
            --freeze-layers ${{ matrix.freeze }} \
            --class-power ${{ matrix.power }} \
            --source-weight 1.0 \
            --sink-weight 1.5 \
            --defense-weight 1.5 \
            --seed 7072
      - name: Gate semantic component
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug="${{ matrix.slug }}"
          root=Path(f"artifacts/xss-semantic-v3-{slug}")
          best=json.loads((root/"best_metrics.json").read_text())["dev"]
          tasks=best["tasks"]
          mins={
              t:min(tasks[t]["per_class_f1"].values())
              for t in ("source","sink","defense")
          }
          passed=bool(
              tasks["source"]["macro_f1"] >= .90 and
              tasks["sink"]["macro_f1"] >= .90 and
              tasks["defense"]["macro_f1"] >= .85 and
              mins["source"] >= .70 and
              mins["sink"] >= .70 and
              mins["defense"] >= .60
          )
          out={
              "slug":slug,
              "research_gate_passed":passed,
              "mean_macro_f1":best["mean_macro_f1"],
              "source_macro_f1":tasks["source"]["macro_f1"],
              "sink_macro_f1":tasks["sink"]["macro_f1"],
              "defense_macro_f1":tasks["defense"]["macro_f1"],
              "min_class_f1":mins,
              "promotion_allowed":False,
              "locked_hard_or_external_used":False,
          }
          (root/"candidate_score.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xss-semantic-v3-candidate-${{ matrix.slug }}
          retention-days: 30
          path: artifacts/xss-semantic-v3-${{ matrix.slug }}/

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-semantic-v3-candidate-*
          path: candidates
          merge-multiple: false
      - name: Select semantic development winner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("candidates").rglob("candidate_score.json")]
          if len(rows)!=4: raise RuntimeError(f"expected 4 scores, got {len(rows)}")
          rows.sort(key=lambda r:(r["research_gate_passed"],r["mean_macro_f1"],
                                  r["defense_macro_f1"],r["sink_macro_f1"]),reverse=True)
          winner=rows[0]
          summary={
              "schema":"xss-semantic-v3-selection",
              "candidates":rows,
              "winner":winner,
              "research_gate_passed":bool(winner["research_gate_passed"]),
              "promotion_allowed":False,
              "locked_hard_or_external_used":False,
              "next_gate":"real upstream integrated benchmark with flow-v2 winner",
          }
          Path("xss_semantic_v3_selection.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          if not winner["research_gate_passed"]:
              raise SystemExit("No semantic-v3 candidate passed the component gate.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-semantic-v3-selection
          retention-days: 30
          path: xss_semantic_v3_selection.json
