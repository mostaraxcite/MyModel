name: External v7 Sealed Gate v4e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-xss-external-v7.yml"
      - "evaluation/evaluate_external_v7.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-external-v7-sealed
  cancel-in-progress: true

env:
  SEMANTIC_RUN_ID: "36920030570"
  SEMANTIC_ARTIFACT: "xss-source-v4e-lr25e5-e12"
  FLOW_RUN_ID: "36867388302"
  FLOW_ARTIFACT: "xss-flow-v2-candidate-f0-lr3e5-e8"
  ALPINE_SHA: "da60871ea404e23e46938c9e6137f05258614c63"
  EXPRESS_SHA: "7ef98448f8b38099ab1ded55e458538ad47a51e7"
  VUE_ROUTER_SHA: "610644a63281a0415b8769f7830c3d80fbb55f49"
  LIT_SHA: "01dbc6673cdc211543932afd0ca04e223e567366"
  SANITIZE_HTML_SHA: "6ac6b8ea4898c2ba7f843d8cdd5f7d036d760a0e"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download v4e semantic winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEMANTIC_ARTIFACT }}
          path: semantic-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download canonical flow winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: flow-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Locate model roots
        id: models
        shell: bash
        run: |
          SEM="$(find semantic-artifact -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find flow-artifact -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"; test -n "$FLOW"
          echo "semantic=$SEM" >> "$GITHUB_OUTPUT"
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"

      - name: Verify v7 protocol was locked before evaluator
        run: |
          git log --format='%H %s' -- benchmarks/external_v7/PROTOCOL.md | head
          test -f benchmarks/external_v7/PROTOCOL.md
          grep -q "LOCKED BEFORE FIRST SCORE" benchmarks/external_v7/PROTOCOL.md

      - name: Fetch fresh pinned upstreams
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external
          fetch_repo () {
            name="$1"; url="$2"; sha="$3"
            git init "external/$name"
            git -C "external/$name" remote add origin "$url"
            git -C "external/$name" fetch --depth 1 origin "$sha"
            git -C "external/$name" checkout --detach FETCH_HEAD
          }
          fetch_repo alpine https://github.com/alpinejs/alpine.git "$ALPINE_SHA"
          fetch_repo express https://github.com/expressjs/express.git "$EXPRESS_SHA"
          fetch_repo vue-router https://github.com/vuejs/router.git "$VUE_ROUTER_SHA"
          fetch_repo lit https://github.com/lit/lit.git "$LIT_SHA"
          fetch_repo sanitize-html https://github.com/apostrophecms/sanitize-html.git "$SANITIZE_HTML_SHA"

      - name: Reject any External v6 repository
        run: |
          test ! -d external/htmx
          test ! -d external/mustache
          test ! -d external/koa
          test ! -d external/react-router
          test ! -d external/turbo

      - name: Selection integrity preflight
        run: |
          uv run python evaluation/evaluate_external_v7.py \
            --alpine-root external/alpine \
            --express-root external/express \
            --vue-router-root external/vue-router \
            --lit-root external/lit \
            --sanitize-html-root external/sanitize-html \
            --select-only

      - name: First sealed v7 score
        run: |
          uv run --group slm python evaluation/evaluate_external_v7.py \
            --alpine-root external/alpine \
            --express-root external/express \
            --vue-router-root external/vue-router \
            --lit-root external/lit \
            --sanitize-html-root external/sanitize-html \
            --semantic-dir "${{ steps.models.outputs.semantic }}" \
            --flow-dir "${{ steps.models.outputs.flow }}" \
            --output reports/xss-external-v7-sealed.json

      - name: Write immutable seal
        if: always()
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          from pathlib import Path
          Path("reports/xss-external-v7-seal.json").write_text(json.dumps({
              "schema":"xss-external-v7-seal",
              "protocol_commit":"b269299ec463e15898e48942391ec0c6ca569b18",
              "protocol":"LOCKED BEFORE FIRST SCORE",
              "semantic_run_id":"36920030570",
              "semantic_artifact":"xss-source-v4e-lr25e5-e12",
              "flow_run_id":"36867388302",
              "flow_artifact":"xss-flow-v2-candidate-f0-lr3e5-e8",
              "thresholds_frozen_before_score":{
                  "system_primary_accuracy":0.85,
                  "model_advice_primary_accuracy":0.70,
                  "minimum_family_system_accuracy":0.50
              },
              "external_v6_reused":False,
              "row_level_failures_quarantined":True,
              "promotion_allowed":False
          },indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-external-v7-sealed
          retention-days: 90
          path: |
            reports/xss-external-v7-sealed.json
            reports/xss-external-v7-seal.json
