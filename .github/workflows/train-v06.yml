name: Train XSS v0.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-v06.yml"

permissions:
  contents: read

concurrency:
  group: xss-v06-training
  cancel-in-progress: false

jobs:
  train-v06:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install training dependencies
        run: uv sync --group lora --group dev

      - name: Preflight regression tests
        run: >
          uv run pytest -q
          tests/test_router.py
          tests/test_xss_v05.py
          tests/test_v05_fixes.py

      - name: Train v0.6 LoRA candidate
        run: |
          rm -rf security-models/xss/adapters/xss-v06
          uv run --group lora python training/train_peft.py \
            --base-model nreimers/MiniLM-L6-H384-uncased \
            --train-data security-models/xss/data/train.jsonl \
            --validation-data security-models/xss/data/validation.jsonl \
            --output-dir security-models/xss/adapters/xss-v06 \
            --adapter-name xss-v0.6 \
            --epochs 2 \
            --batch-size 16 \
            --max-length 256 \
            --rank 8 \
            --alpha 16 \
            --dropout 0.05 \
            --lr 2e-4 \
            --seed 2027 2>&1 | tee security-models/xss/evaluation/v06_training.log

      - name: Register candidate locally for evaluation
        run: |
          uv run python - <<'PY'
          from xss_specialist.adapter_registry import default_registry, register_adapter
          reg = default_registry()
          register_adapter(
              reg,
              name="xss-v0.6",
              kind="peft",
              base_model="nreimers/MiniLM-L6-H384-uncased",
              path="security-models/xss/adapters/xss-v06",
              description="v0.6 MiniLM-L6 LoRA candidate; query/key/value targets; not promoted.",
              promoted=False,
              activate=False,
          )
          PY

      - name: Hard Test v4 evaluation
        run: |
          uv run --group lora python security-models/xss/evaluation/evaluate.py \
            --adapter xss-v0.6 \
            --output security-models/xss/evaluation/v06_hard.json

      - name: External Test v5 evaluation
        run: |
          uv run --group lora python security-models/xss/evaluation/evaluate_external_v5.py \
            --adapter xss-v0.6 \
            --output security-models/xss/evaluation/v06_external.json \
            --predictions security-models/xss/evaluation/v06_external_predictions.jsonl

      - name: Build v0.6 summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          root = Path("security-models/xss")
          out = {"candidate": "xss-v0.6", "promoted": False}

          meta = root / "adapters/xss-v06/adapter_metadata.json"
          hard = root / "evaluation/v06_hard.json"
          ext = root / "evaluation/v06_external.json"

          if meta.exists():
              m = json.loads(meta.read_text())
              out["training"] = {
                  "base_model": m.get("base_model"),
                  "train_rows": m.get("train_rows"),
                  "validation_rows": m.get("validation_rows"),
                  "lora": m.get("lora"),
                  "best_validation_metric": m.get("best_metric"),
                  "seed": m.get("seed"),
                  "external_test_v5_used_for_training": m.get("external_test_v5_used_for_training"),
              }

          if hard.exists():
              h = json.loads(hard.read_text())
              out["hard_test_v4"] = {
                  "count": h.get("count"),
                  "macro_f1": h.get("classification_report", {}).get("macro avg", {}).get("f1-score"),
                  "promotion": h.get("promotion"),
                  "false_rates": h.get("false_rates"),
              }

          if ext.exists():
              e = json.loads(ext.read_text())
              out["external_test_v5"] = {
                  "count": e.get("count"),
                  "coverage": e.get("coverage"),
                  "decided_macro_f1": e.get("decided_macro_f1"),
                  "xss_false_positive_rate_all": e.get("xss_false_positive_rate_all"),
                  "xss_false_negative_rate_all": e.get("xss_false_negative_rate_all"),
                  "promotion": e.get("promotion"),
              }

          target = root / "evaluation/v06_summary.json"
          target.write_text(json.dumps(out, indent=2) + "\n")
          print(target.read_text())
          PY

      - name: Upload v0.6 candidate and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xss-v06-candidate
          if-no-files-found: warn
          retention-days: 30
          path: |
            security-models/xss/adapters/xss-v06/
            security-models/xss/evaluation/v06_training.log
            security-models/xss/evaluation/v06_hard.json
            security-models/xss/evaluation/v06_external.json
            security-models/xss/evaluation/v06_external_predictions.jsonl
            security-models/xss/evaluation/v06_summary.json
