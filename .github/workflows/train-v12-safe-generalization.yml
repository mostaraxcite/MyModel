name: Train XSS v0.12 SAFE Generalization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-v12-safe-generalization.yml"

permissions:
  contents: read

concurrency:
  group: xss-v12-safe-generalization
  cancel-in-progress: false

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
  DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"
  SANITIZE_HTML_SHA: "6ac6b8ea4898c2ba7f843d8cdd5f7d036d760a0e"

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Regression tests
        run: >
          uv run pytest -q
          tests/test_router.py
          tests/test_xss_v05.py
          tests/test_v05_fixes.py
          tests/test_pipeline.py

      - name: Build base generalization corpus
        run: |
          uv run python security-models/xss/scripts/build_v10_generalization_dataset.py \
            --seed 2032 \
            --groups 1800 \
            --legacy-per-label 1800 \
            --validation-fraction 0.18

      - name: Build SAFE hard-negative corpus
        run: |
          uv run python security-models/xss/scripts/build_v12_safe_hard_negatives.py \
            --seed 2032 \
            --groups 2400 \
            --validation-fraction 0.20 \
            | tee security-models/xss/evaluation/v12_safe_build.log

      - name: Fetch pinned independent real-world sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external

          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD

          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD

          git init external/sanitize-html
          git -C external/sanitize-html remote add origin https://github.com/apostrophecms/sanitize-html.git
          git -C external/sanitize-html fetch --depth 1 origin "$SANITIZE_HTML_SHA"
          git -C external/sanitize-html checkout --detach FETCH_HEAD

      - name: Build independent real-world development data
        run: |
          uv run python security-models/xss/scripts/build_v08_realworld.py \
            --firing-range-root external/firing-range \
            --dompurify-root external/DOMPurify \
            --sanitize-html-root external/sanitize-html \
            --external-test security-models/xss/data/external_test_v5.jsonl \
            --output-dir security-models/xss/data \
            --seed 2032 \
            --validation-fraction 0.20 \
            | tee security-models/xss/evaluation/v12_realworld_build.log

      - name: Build 25 50 100 percent SAFE training variants
        run: |
          uv run python - <<'PY'
          import hashlib, json, random
          from collections import defaultdict
          from pathlib import Path

          data = Path("security-models/xss/data")

          def read(name):
              return [json.loads(x) for x in (data / name).read_text().splitlines() if x]

          def digest(row):
              return hashlib.sha256(row["code"].encode()).hexdigest()

          def dedup(rows, forbidden=None):
              forbidden = forbidden or set()
              out, seen = [], set()
              for row in rows:
                  h = digest(row)
                  if h in forbidden or h in seen:
                      continue
                  seen.add(h)
                  out.append(row)
              return out

          base = read("train_v10.jsonl")
          real = read("realworld_train_v08.jsonl")
          safe = read("safe_hard_train_v12.jsonl")
          validation = read("validation_v10.jsonl")
          locked = read("test.jsonl") + read("hard_test.jsonl") + read("external_test_v5.jsonl")
          locked_h = {digest(r) for r in locked}
          validation_h = {digest(r) for r in validation}

          groups = defaultdict(list)
          for row in safe:
              groups[row["group_id"]].append(row)
          keys = sorted(groups)
          random.Random(2032).shuffle(keys)

          manifest = {"seed": 2032, "base": len(base), "realworld": len(real), "safe_groups_total": len(keys), "variants": {}}
          for pct in (25, 50, 100):
              take = max(1, round(len(keys) * pct / 100))
              selected = [row for key in keys[:take] for row in groups[key]]
              merged = dedup(base + real + selected, locked_h | validation_h)
              path = data / f"train_v12_safe{pct}.jsonl"
              path.write_text("".join(json.dumps(r, sort_keys=True) + "\n" for r in merged))
              manifest["variants"][str(pct)] = {
                  "rows": len(merged),
                  "safe_groups": take,
                  "labels": {
                      label: sum(r["label"] == label for r in merged)
                      for label in ("SAFE", "POSSIBLE_XSS", "XSS")
                  },
              }

          (data / "manifest_v12_training.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Verify locked isolation and stress holdouts
        run: |
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path

          data = Path("security-models/xss/data")
          def read(name):
              return [json.loads(x) for x in (data / name).read_text().splitlines() if x]
          h = lambda r: hashlib.sha256(r["code"].encode()).hexdigest()

          locked_h = {h(r) for r in read("test.jsonl") + read("hard_test.jsonl") + read("external_test_v5.jsonl")}
          val_h = {h(r) for r in read("safe_hard_validation_v12.jsonl")}
          for pct in (25, 50, 100):
              train = read(f"train_v12_safe{pct}.jsonl")
              train_h = {h(r) for r in train}
              assert not (train_h & locked_h)
              assert not (train_h & val_h)

          safe = read("safe_stress_v12.jsonl")
          attack = read("attack_stress_v12.jsonl")
          binary = read("binary_stress_v12.jsonl")
          assert safe and attack and binary
          assert all(r["label"] == "SAFE" for r in safe)
          assert all(r["label"] == "XSS" for r in attack)
          print(json.dumps({
              "safe_stress": len(safe),
              "attack_stress": len(attack),
              "binary_stress": len(binary),
              "locked_overlap": 0,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v12-prepared-data
          retention-days: 14
          path: |
            security-models/xss/data/train_v12_safe25.jsonl
            security-models/xss/data/train_v12_safe50.jsonl
            security-models/xss/data/train_v12_safe100.jsonl
            security-models/xss/data/validation_v10.jsonl
            security-models/xss/data/realworld_validation_v08.jsonl
            security-models/xss/data/safe_hard_validation_v12.jsonl
            security-models/xss/data/safe_stress_v12.jsonl
            security-models/xss/data/attack_stress_v12.jsonl
            security-models/xss/data/binary_stress_v12.jsonl
            security-models/xss/data/manifest_v12_safe.json
            security-models/xss/data/manifest_v12_training.json
            security-models/xss/evaluation/v12_safe_build.log
            security-models/xss/evaluation/v12_realworld_build.log

  candidate:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        safe_pct: [25, 50, 100]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: xss-v12-prepared-data
          path: security-models/xss

      - name: Full fine-tune MiniLM
        run: |
          OUT="security-models/xss/full-models/v12-safe${{ matrix.safe_pct }}"
          rm -rf "$OUT"
          uv run --group slm python training/train_full_encoder.py \
            --model nreimers/MiniLM-L6-H384-uncased \
            --train-data "security-models/xss/data/train_v12_safe${{ matrix.safe_pct }}.jsonl" \
            --validation-data security-models/xss/data/validation_v10.jsonl \
            --output-dir "$OUT" \
            --run-name "xss-v0.12-safe${{ matrix.safe_pct }}" \
            --epochs 5 \
            --batch-size 32 \
            --max-length 128 \
            --lr 3e-5 \
            --seed 2032

      - name: Calibrate on SAFE and attack stress holdout
        run: |
          uv run --group slm python security-models/xss/evaluation/calibrate_v12.py \
            --model-dir "security-models/xss/full-models/v12-safe${{ matrix.safe_pct }}" \
            --stress-data security-models/xss/data/binary_stress_v12.jsonl \
            --three-way-data security-models/xss/data/safe_hard_validation_v12.jsonl \
            --output "security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_calibration.json"

      - name: Evaluate calibrated base validation
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "security-models/xss/full-models/v12-safe${{ matrix.safe_pct }}" \
            --data security-models/xss/data/validation_v10.jsonl \
            --calibration "security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_calibration.json" \
            --output "security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_validation.json"

      - name: Evaluate calibrated independent real-world validation
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "security-models/xss/full-models/v12-safe${{ matrix.safe_pct }}" \
            --data security-models/xss/data/realworld_validation_v08.jsonl \
            --calibration "security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_calibration.json" \
            --output "security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_realworld.json" \
            --external-binary

      - name: Score candidate without locked tests
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          pct = "${{ matrix.safe_pct }}"
          root = Path("security-models/xss/evaluation")
          cal = json.loads((root / f"v12_safe{pct}_calibration.json").read_text())
          val = json.loads((root / f"v12_safe{pct}_validation.json").read_text())
          real = json.loads((root / f"v12_safe{pct}_realworld.json").read_text())

          report = val["classification_report"]
          macro = float(report["macro avg"]["f1-score"])
          safe_recall = float(report["SAFE"]["recall"])
          xss_recall = float(report["XSS"]["recall"])

          viable = bool(
              cal["viable"]
              and macro >= 0.90
              and safe_recall >= 0.88
              and xss_recall >= 0.85
              and real["coverage"] >= 0.90
              and real["decided_macro_f1"] >= 0.80
              and real["xss_false_positive_rate_all"] <= 0.15
              and real["xss_false_negative_rate_all"] <= 0.10
          )

          score = (
              0.30 * macro
              + 0.25 * float(real["decided_macro_f1"])
              + 0.20 * float(real["coverage"])
              + 0.15 * (1.0 - float(real["xss_false_positive_rate_all"]))
              + 0.10 * (1.0 - float(real["xss_false_negative_rate_all"]))
          )

          out = {
              "safe_pct": int(pct),
              "viable": viable,
              "score": score,
              "calibration": cal,
              "validation_macro_f1": macro,
              "validation_safe_recall": safe_recall,
              "validation_xss_recall": xss_recall,
              "realworld": {
                  "coverage": real["coverage"],
                  "macro_f1": real["decided_macro_f1"],
                  "xss_fpr": real["xss_false_positive_rate_all"],
                  "xss_fnr": real["xss_false_negative_rate_all"],
              },
          }
          path = root / f"v12_safe{pct}_score.json"
          path.write_text(json.dumps(out, indent=2) + "\n")
          print(path.read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v12-candidate-safe${{ matrix.safe_pct }}
          retention-days: 30
          path: |
            security-models/xss/full-models/v12-safe${{ matrix.safe_pct }}/
            security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_calibration.json
            security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_validation.json
            security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_realworld.json
            security-models/xss/evaluation/v12_safe${{ matrix.safe_pct }}_score.json

  select:
    needs: candidate
    runs-on: ubuntu-latest
    outputs:
      safe_pct: ${{ steps.pick.outputs.safe_pct }}
      score: ${{ steps.pick.outputs.score }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-v12-candidate-safe*
          path: candidates
          merge-multiple: false

      - name: Select only viable SAFE-generalization winner
        id: pick
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = []
          for pct in (25, 50, 100):
              matches = list(Path("candidates").rglob(f"v12_safe{pct}_score.json"))
              if len(matches) != 1:
                  raise RuntimeError(f"missing candidate score for {pct}: {matches}")
              rows.append(json.loads(matches[0].read_text()))

          viable = [r for r in rows if r["viable"]]
          if not viable:
              summary = {"candidates": rows, "winner": None, "stopped": True}
              Path("v12_selection.json").write_text(json.dumps(summary, indent=2) + "\n")
              print(json.dumps(summary, indent=2))
              raise SystemExit("No v0.12 candidate passed SAFE-generalization gates; locked tests remain untouched.")

          viable.sort(
              key=lambda r: (
                  r["score"],
                  -r["realworld"]["xss_fpr"],
                  -r["realworld"]["xss_fnr"],
                  r["validation_macro_f1"],
              ),
              reverse=True,
          )
          winner = viable[0]
          summary = {"candidates": rows, "winner": winner, "stopped": False}
          Path("v12_selection.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"safe_pct={winner['safe_pct']}\n")
              f.write(f"score={winner['score']}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v12-selection
          retention-days: 30
          path: v12_selection.json

  final-eval:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SAFE_PCT: ${{ needs.select.outputs.safe_pct }}
      DEV_SCORE: ${{ needs.select.outputs.score }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download selected candidate
        uses: actions/download-artifact@v4
        with:
          name: xss-v12-candidate-safe${{ needs.select.outputs.safe_pct }}
          path: selected

      - name: Locate model and calibration
        id: locate
        run: |
          MODEL_DIR="$(find selected -type f -name config.json -printf '%h\n' | head -1)"
          CAL="$(find selected -type f -name 'v12_safe*_calibration.json' | head -1)"
          test -n "$MODEL_DIR"
          test -n "$CAL"
          echo "model=$MODEL_DIR" >> "$GITHUB_OUTPUT"
          echo "calibration=$CAL" >> "$GITHUB_OUTPUT"

      - name: Final Hard Test v4
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "${{ steps.locate.outputs.model }}" \
            --data security-models/xss/data/hard_test.jsonl \
            --calibration "${{ steps.locate.outputs.calibration }}" \
            --output security-models/xss/evaluation/v12_hard.json

      - name: Final External Test v5
        run: |
          uv run --group slm python security-models/xss/evaluation/evaluate_full_model.py \
            --model-dir "${{ steps.locate.outputs.model }}" \
            --data security-models/xss/data/external_test_v5.jsonl \
            --calibration "${{ steps.locate.outputs.calibration }}" \
            --output security-models/xss/evaluation/v12_external.json \
            --external-binary

      - name: Build v0.12 summary
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("security-models/xss/evaluation")
          hard = json.loads((root / "v12_hard.json").read_text())
          ext = json.loads((root / "v12_external.json").read_text())
          out = {
              "candidate": "xss-v0.12",
              "training": "MiniLM full_finetune + SAFE hard negatives + frozen dev calibration",
              "safe_training_percent": int(os.environ["SAFE_PCT"]),
              "development_score": float(os.environ["DEV_SCORE"]),
              "hard_test_v4": {
                  "macro_f1": hard["classification_report"]["macro avg"]["f1-score"],
                  "promotion": hard["promotion"],
                  "false_rates": hard["false_rates"],
              },
              "external_test_v5": {
                  "coverage": ext["coverage"],
                  "decided_macro_f1": ext["decided_macro_f1"],
                  "xss_false_positive_rate_all": ext["xss_false_positive_rate_all"],
                  "xss_false_negative_rate_all": ext["xss_false_negative_rate_all"],
                  "promotion": ext["promotion"],
              },
          }
          out["eligible_for_promotion"] = bool(
              out["hard_test_v4"]["promotion"]["passed"]
              and out["external_test_v5"]["promotion"]["passed"]
          )
          (root / "v12_summary.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-v12-final
          retention-days: 30
          path: |
            security-models/xss/evaluation/v12_hard.json
            security-models/xss/evaluation/v12_external.json
            security-models/xss/evaluation/v12_summary.json
