name: Integrate XSS v4d + Flow v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-xss-specialist-v4d.yml"
      - "xss_specialist/dual_branch_review.py"
      - "evaluation/evaluate_integrated_real_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-integrated-v4d
  cancel-in-progress: true

env:
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  FIRING_RANGE_SHA: "4f991a6418b07a66cd63006f4a2bec27c84b72f4"
  DOMPURIFY_SHA: "368ee78d528087ab192bcf06838013ec61c87ec8"
  SEMANTIC_RUN_ID: "36900022333"
  SEMANTIC_ARTIFACT: "xss-sink-v4d-lr3e4-e12"
  FLOW_RUN_ID: "36867388302"
  FLOW_ARTIFACT: "xss-flow-v2-candidate-f0-lr3e5-e8"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Compile integrated path
        run: |
          uv run python -m py_compile \
            xss_specialist/dual_branch_review.py \
            evaluation/evaluate_integrated_real_v1.py

      - name: Download v4d semantic winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEMANTIC_ARTIFACT }}
          path: semantic-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download canonical flow winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: flow-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Locate and verify model roots
        id: models
        shell: bash
        run: |
          SEM="$(find semantic-artifact -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find flow-artifact -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"
          test -n "$FLOW"
          test -f "$SEM/semantic_heads.pt"
          test -f "$SEM/best_metrics.json"
          test -f "$FLOW/flow_head.pt"

          python - "$SEM" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          dev = json.loads((root / "best_metrics.json").read_text())["dev"]
          assert dev["source"]["macro_f1"] >= .90, dev["source"]
          assert dev["sink"]["macro_f1"] >= .98, dev["sink"]
          assert dev["defense"]["macro_f1"] >= .85, dev["defense"]
          assert min(dev["sink"]["per_class_f1"].values()) >= .90, dev["sink"]
          print(json.dumps({
              "source_macro_f1": dev["source"]["macro_f1"],
              "sink_macro_f1": dev["sink"]["macro_f1"],
              "defense_macro_f1": dev["defense"]["macro_f1"],
              "sink_min_class_f1": min(dev["sink"]["per_class_f1"].values()),
          }, indent=2))
          PY

          echo "semantic=$SEM" >> "$GITHUB_OUTPUT"
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned independent real XSS sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external

          git init external/firing-range
          git -C external/firing-range remote add origin https://github.com/google/firing-range.git
          git -C external/firing-range fetch --depth 1 origin "$FIRING_RANGE_SHA"
          git -C external/firing-range checkout --detach FETCH_HEAD

          git init external/DOMPurify
          git -C external/DOMPurify remote add origin https://github.com/cure53/DOMPurify.git
          git -C external/DOMPurify fetch --depth 1 origin "$DOMPURIFY_SHA"
          git -C external/DOMPurify checkout --detach FETCH_HEAD

      - name: Evaluate v4d + flow on real upstream benchmark
        run: |
          uv run --group slm python evaluation/evaluate_integrated_real_v1.py \
            --semantic-model-dir "${{ steps.models.outputs.semantic }}" \
            --flow-model-dir "${{ steps.models.outputs.flow }}" \
            --firing-range-root external/firing-range \
            --dompurify-root external/DOMPurify \
            --output reports/xss-integrated-v4d.json

      - name: Enforce integration research gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/xss-integrated-v4d.json").read_text())
          summary = {
              "schema": "xss-integrated-v4d-gate",
              "semantic_run_id": "36900022333",
              "semantic_artifact": "xss-sink-v4d-lr3e4-e12",
              "flow_run_id": "36867388302",
              "flow_artifact": "xss-flow-v2-candidate-f0-lr3e5-e8",
              "case_count": report["case_count"],
              "metrics": report["metrics"],
              "tuple_accuracy": report["tuple_accuracy"],
              "research_gate_passed": bool(report["research_gate_passed"]),
              "model_can_confirm_xss": False,
              "browser_execution_required_for_confirmation": True,
              "locked_hard_benchmark_used": False,
              "promotion_allowed": False,
          }
          Path("reports/xss-integrated-v4d-gate.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          if not summary["research_gate_passed"]:
              raise SystemExit("v4d + flow real-upstream integration gate failed")
          PY

      - name: Verify final-decision authority boundary
        run: |
          uv run --group slm python - <<'PY'
          from xss_specialist.dual_branch_review import review

          result = review(
              "const x = location.hash; box.innerHTML = x;",
              semantic_model_dir="${{ steps.models.outputs.semantic }}",
              flow_model_dir="${{ steps.models.outputs.flow }}",
              relation={
                  "source_expression": "x",
                  "sink_expression": "box.innerHTML",
                  "flow_excerpt": "box.innerHTML = x;",
              },
              confirm_browser=False,
          )
          assert result["advisory"]["final_judge"] is False
          assert result["final"]["confirmed"] is False
          assert result["final"]["verdict"] != "XSS"
          assert result["policy"]["model_can_confirm_xss"] is False
          assert result["policy"]["browser_execution_required_for_confirmation"] is True
          print(result)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-integrated-v4d-report
          retention-days: 30
          path: |
            reports/xss-integrated-v4d.json
            reports/xss-integrated-v4d-gate.json

  bundle:
    needs: evaluate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download v4d semantic winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEMANTIC_ARTIFACT }}
          path: selected-semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEMANTIC_RUN_ID }}

      - name: Download flow winner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLOW_ARTIFACT }}
          path: selected-flow
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FLOW_RUN_ID }}

      - name: Build integrated v4d specialist bundle
        shell: bash
        run: |
          SEM="$(find selected-semantic -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          FLOW="$(find selected-flow -type f -name flow_branch_config.json -printf '%h\n' | head -1)"
          test -n "$SEM"
          test -n "$FLOW"

          mkdir -p artifacts/xss-integrated-v4d/semantic artifacts/xss-integrated-v4d/flow
          cp -R "$SEM"/. artifacts/xss-integrated-v4d/semantic/
          cp -R "$FLOW"/. artifacts/xss-integrated-v4d/flow/

          python - <<'PY'
          import json
          from pathlib import Path
          cfg = {
              "schema": "xss-integrated-v4d",
              "semantic": "semantic",
              "flow": "flow",
              "semantic_run_id": "36900022333",
              "semantic_candidate": "lr3e4-e12",
              "flow_run_id": "36867388302",
              "flow_candidate": "f0-lr3e5-e8",
              "model_can_confirm_xss": False,
              "deterministic_static_authority": True,
              "browser_execution_required_for_confirmation": True,
              "research_gate": "real-upstream-integration",
              "locked_hard_benchmark_used": False,
              "promotion_allowed": False,
          }
          Path("artifacts/xss-integrated-v4d/integrated_config.json").write_text(
              json.dumps(cfg, indent=2) + "\n"
          )
          print(json.dumps(cfg, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-integrated-v4d-bundle
          retention-days: 30
          path: artifacts/xss-integrated-v4d/
