name: XSS explicit DOM context regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  current-engine-dom-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest tree-sitter==0.25.2 tree-sitter-javascript==0.25.0 playwright==1.55.0
      - run: python -m pytest -q tests/test_dom_context_v12.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m evaluation.dom_context_v12_regression --output results/xss-dom-context-v12.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-dom-context-v12
          path: results/xss-dom-context-v12.json
