name: Authorized XSS Live Canary

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Explicitly authorized target base URL, e.g. https://app.example.com/"
        required: true
        type: string
      allowed_prefix:
        description: "Allowed path prefix, e.g. /app"
        required: true
        default: "/"
        type: string
      operator:
        description: "Operator identity"
        required: true
        type: string
      assessment_id:
        description: "Unique assessment / authorization reference"
        required: true
        type: string
      acknowledge_authorization:
        description: "I have explicit authorization to test this target"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xss-live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without explicit authorization
        if: ${{ inputs.acknowledge_authorization != true }}
        run: |
          echo "Authorization acknowledgement is required."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Re-run local acceptance before any external request
        run: |
          uv run python -m live.evaluate
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/live_acceptance.json")
          if not p.exists():
              raise SystemExit("local acceptance gate missing")
          d=json.loads(p.read_text())
          if not d.get("ACCEPTED"):
              raise SystemExit("local acceptance gate failed")
          print("local acceptance passed")
          PY

      - name: Run bounded authorized canary
        run: |
          uv run python -m live.pilot \
            --target "${{ inputs.target }}" \
            --operator "${{ inputs.operator }}" \
            --assessment-id "${{ inputs.assessment_id }}" \
            --acknowledge-authorization \
            --allowed-prefix "${{ inputs.allowed_prefix }}" \
            --budget 80 \
            --rate 1.0 \
            --test-class reflected \
            --test-class dom \
            --authorized-external

      - name: Upload quarantine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xss-live-canary-${{ inputs.assessment_id }}
          retention-days: 30
          path: reports/live_assessments/
