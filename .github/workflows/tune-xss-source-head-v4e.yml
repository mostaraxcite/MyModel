name: Tune XSS Source Head v4e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tune-xss-source-head-v4e.yml"
      - "training/augment_source_v4e.py"
      - "training/train_source_head_v4e.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xss-source-head-v4e
  cancel-in-progress: true

env:
  PREP_RUN_ID: "36872169684"
  BASE_MODEL_RUN_ID: "36900022333"
  BASE_MODEL_ARTIFACT: "xss-sink-v4d-lr3e4-e12"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: lr8e5-e8
            lr: 0.00008
            epochs: 8
          - slug: lr15e5-e10
            lr: 0.00015
            epochs: 10
          - slug: lr25e5-e12
            lr: 0.00025
            epochs: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group slm --group dev

      - name: Download prepared v4 data
        uses: actions/download-artifact@v4
        with:
          name: xss-structural-field-v4-prepared
          path: prepared
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREP_RUN_ID }}

      - name: Download validated v4d checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_MODEL_ARTIFACT }}
          path: base-model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_MODEL_RUN_ID }}

      - name: Locate inputs
        id: locate
        shell: bash
        run: |
          TRAIN="$(find prepared -type f -path '*/semantic-field-v4/train.jsonl' | head -1)"
          DEV="$(find prepared -type f -path '*/semantic-field-v4/dev.jsonl' | head -1)"
          MODEL="$(find base-model -type f -name dual_branch_config.json -printf '%h\n' | head -1)"
          test -n "$TRAIN"; test -n "$DEV"; test -n "$MODEL"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Add independent source hard examples
        run: |
          uv run python training/augment_source_v4e.py \
            --base-train "${{ steps.locate.outputs.train }}" \
            --output data/source-v4e/train.jsonl \
            --repeat 10 \
            --seed 10111

      - name: Verify sealed sets are absent and dev remains untouched
        run: |
          test ! -e benchmarks/external_v6/cases.jsonl
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("${{ steps.locate.outputs.dev }}")
          print("dev_sha256",hashlib.sha256(p.read_bytes()).hexdigest())
          print("external_v6_rows_used",False)
          PY

      - name: Fine-tune source head only
        run: |
          OUT="artifacts/xss-source-v4e-${{ matrix.slug }}"
          uv run --group slm python training/train_source_head_v4e.py \
            --checkpoint "${{ steps.locate.outputs.model }}" \
            --train data/source-v4e/train.jsonl \
            --dev "${{ steps.locate.outputs.dev }}" \
            --output-dir "$OUT" \
            --epochs ${{ matrix.epochs }} \
            --batch-size 64 \
            --max-length 96 \
            --lr ${{ matrix.lr }} \
            --seed 10112

      - name: Strict preservation gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug="${{ matrix.slug }}"
          root=Path(f"artifacts/xss-source-v4e-{slug}")
          b=json.loads((root/"best_metrics.json").read_text())["dev"]
          mins={t:min(b[t]["per_class_f1"].values()) for t in ("source","sink","defense")}
          passed=bool(
              b["source"]["macro_f1"]>=.94 and
              b["sink"]["macro_f1"]>=.98 and
              b["defense"]["macro_f1"]>=.85 and
              mins["source"]>=.75 and
              mins["sink"]>=.90 and
              mins["defense"]>=.60
          )
          out={
              "slug":slug,"passed":passed,
              "source":b["source"],"sink":b["sink"],"defense":b["defense"],
              "mins":mins,
              "external_v6_used":False,
              "locked_hard_used":False,
              "promotion_allowed":False,
          }
          (root/"candidate_score.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xss-source-v4e-${{ matrix.slug }}
          retention-days: 30
          path: artifacts/xss-source-v4e-${{ matrix.slug }}/

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xss-source-v4e-*
          path: candidates

      - name: Select strict winner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("candidates").rglob("candidate_score.json")]
          if len(rows)!=3:
              raise RuntimeError(f"expected 3 candidates, got {len(rows)}")
          rows.sort(
              key=lambda r:(r["passed"],r["source"]["macro_f1"],min(r["source"]["per_class_f1"].values())),
              reverse=True,
          )
          winner=rows[0]
          summary={
              "schema":"xss-source-head-v4e-selection",
              "candidates":rows,
              "winner":winner,
              "research_gate_passed":bool(winner["passed"]),
              "external_v6_reused":False,
              "promotion_allowed":False,
              "next_gate":"fresh sealed external v7 with new repositories and frozen protocol",
          }
          Path("xss_source_v4e_selection.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          if not winner["passed"]:
              raise SystemExit("source-head v4e strict gate failed")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-source-v4e-selection
          retention-days: 30
          path: xss_source_v4e_selection.json
