name: Audit New XSS Static Suite (One-Time)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xss-2026-static-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[audit-xss-fresh]')
    name: Score reserved audit cases without training or network scanning
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install -q uv
      - name: Install pinned local dependencies
        run: uv sync --group dev
      - name: Audit fixed oracle on held-back manual cases once
        run: |
          set -euo pipefail
          mkdir -p static-xss-audit
          uv run python -m evaluation.fresh_static_xss_suite --partition audit --report static-xss-audit/audit.json
          uv run python -m evaluation.fresh_static_xss_suite --partition diagnostic --report static-xss-audit/diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("static-xss-audit/audit.json").read_text())
          dev=json.loads(Path("static-xss-audit/diagnostic.json").read_text())
          assert audit["n"]==16 and dev["n"]==26
          assert audit["browser_confirmed"]==0 and audit["promotion"]=="DO_NOT_PROMOTE"
          summary={
              "suite":audit["suite"],
              "method":"new synthetic static test; NOT browser confirmation",
              "diagnostic":dev["metrics"],
              "audit":audit["metrics"],
              "audit_confusion":audit["confusion"],
              "uncertainty":"INCONCLUSIVE is an abstention, not a correct XSS/no-XSS detection",
              "model_checkpoint_tested":False,
              "promotion":"DO_NOT_PROMOTE",
          }
          Path("static-xss-audit/summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("=== STATIC XSS AUDIT VERIFIED SUMMARY ===")
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve all diagnostics and per-case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-xss-static-audit-${{ github.run_id }}
          path: static-xss-audit
          retention-days: 30
          if-no-files-found: warn
