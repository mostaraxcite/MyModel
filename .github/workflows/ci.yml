name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Compile Python sources
        run: uv run python -m compileall -q xss_specialist training evaluation kaggle/spark_xss_eval.py kaggle/spark_xss_train_v2.py kaggle/spark_xss_eval_v2.py kaggle/spark_xss_evidence_v3_train.py kaggle/spark_evidence_v3_eval.py security-models/xss
      - name: Run core regression tests
        run: >
          uv run pytest -q
          tests/test_router.py
          tests/test_xss_v05.py
          tests/test_v05_fixes.py
          tests/test_pipeline.py
          tests/test_taint_v1.py
          tests/test_flow_relations.py
          tests/test_spark_xss_training.py
          tests/test_kaggle_xss_kernel.py
          tests/test_spark_xss_independent_eval.py
          tests/test_spark_xss_v2_data.py
          tests/test_spark_xss_v2_evaluator.py
          tests/test_evidence_first.py
          tests/test_spark_evidence_v3.py
          tests/test_spark_evidence_v3_kernel.py
          tests/test_evidence_v3_regression.py
          tests/test_evidence_source_transforms.py
          tests/test_spark_evidence_v3_model_eval.py
          tests/test_grounded_advisor.py
      - name: Audit conservative XSS evidence gate on exposed regression
        run: uv run python -m evaluation.evidence_v3_regression

  kaggle-cli-smoke:
    name: Verify pinned Kaggle CLI publish-without-run support
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned upstream CLI
        run: python -m pip install -q "git+https://github.com/Kaggle/kaggle-cli.git@9c57dd74c29904c40ff7879eed33644be89d2e2f"
      - name: Verify --no-run recognized without Kaggle credentials
        run: |
          kaggle kernels push --help | grep -F -- '--no-run'
          kaggle kernels push --help | grep -F -- '--accelerator'
